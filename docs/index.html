<title>Sítio dos Bichos</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Mulish:wght@400;600;700;800&display=swap">
<style>
/* Layout: app de uma coluna (até 480px). Topo com saldo, conteúdo rolável e 5 abas: Sítio, Ovos, Obras, Guilda, Metas. */
:root{
  --bg:#E4EEE8; --surface:#F6FAF7; --surface2:#D6E5DB; --ink:#12301F; --muted:#4D6657; --line:#BFD3C6;
  --grass:#BCDDC4; --yolk:#F4B31F; --yolk-ink:#2B1D00; --sky:#1F78B8; --good:#23834A; --bad:#C0392B;
  --r0:#6F8478; --r1:#23834A; --r2:#1F78B8; --r3:#7A4CC8; --r4:#B87400;
  --sky-a:#BFE3F5; --sky-b:#EAF6EE; --sun:#F8D45C; --hill:#A7D2B0; --ground:#8CC59A; --ground2:#79B78A;
  --barn:#C95A4B; --roof:#7B3A32; --door:#F3E7D3; --silo:#D7DDE0; --wall:#E9E1CE; --glass:#BFE8F2; --fence:#8A6A44;
  --font-display:'Fredoka',system-ui,sans-serif; --font-body:'Mulish',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1A13; --surface:#15271D; --surface2:#1E3427; --ink:#E4F1E8; --muted:#9DB8A7; --line:#2A4435;
    --grass:#1B3A28; --sky:#2D7FC2; --good:#4FC17F; --bad:#EE7A6F;
    --r0:#9BB0A2; --r1:#4FC17F; --r2:#5DB4F0; --r3:#B18BF2; --r4:#F7BC3A;
    --sky-a:#0B1F3A; --sky-b:#1B3A4B; --sun:#E8EEF2; --hill:#1E4630; --ground:#1B3A28; --ground2:#15301F;
    --barn:#8E3F36; --roof:#4D2420; --door:#C9BFAA; --silo:#7C8A90; --wall:#A89F8A; --glass:#6FB3C4; --fence:#6B5638;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1A13; --surface:#15271D; --surface2:#1E3427; --ink:#E4F1E8; --muted:#9DB8A7; --line:#2A4435;
  --grass:#1B3A28; --sky:#2D7FC2; --good:#4FC17F; --bad:#EE7A6F;
  --r0:#9BB0A2; --r1:#4FC17F; --r2:#5DB4F0; --r3:#B18BF2; --r4:#F7BC3A;
  --sky-a:#0B1F3A; --sky-b:#1B3A4B; --sun:#E8EEF2; --hill:#1E4630; --ground:#1B3A28; --ground2:#15301F;
  --barn:#8E3F36; --roof:#4D2420; --door:#C9BFAA; --silo:#7C8A90; --wall:#A89F8A; --glass:#6FB3C4; --fence:#6B5638;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--font-body);-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
[hidden]{display:none!important}
h1,h2,h3,p{margin:0}
.shell{display:flex;flex-direction:column;height:100%;max-width:480px;margin:0 auto;padding-inline:16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px 12px;padding-block:12px 8px;flex-wrap:wrap}
.brand{font:700 19px/1 var(--font-display);letter-spacing:.01em}
.wallet{display:flex;gap:6px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 11px 4px 7px;font:600 14px var(--font-display);font-variant-numeric:tabular-nums}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.iconbtn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
main{flex:1;min-height:0;overflow-y:auto;padding-block:8px 16px;display:flex;flex-direction:column;gap:14px}
nav{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;border-top:1px solid var(--line);padding-block:6px 8px}
nav button{position:relative;background:none;border:0;border-top:3px solid transparent;color:var(--muted);font:600 12px var(--font-display);letter-spacing:.03em;padding:8px 0 4px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;min-height:48px}
nav button.on{color:var(--ink);border-top-color:var(--yolk)}
nav button.has::after{content:'';position:absolute;top:8px;right:calc(50% - 20px);width:9px;height:9px;border-radius:50%;background:var(--bad);border:2px solid var(--bg)}
nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px}
.card.lock{opacity:.7}
.eyebrow{font:600 12px var(--font-display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h2{font:600 18px/1.2 var(--font-display)}
h3{font:600 16px/1.2 var(--font-display)}
.muted{color:var(--muted);font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1 1 140px;min-width:0}
.between{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.btn{border:0;border-radius:12px;padding:10px 14px;min-height:44px;font:600 15px var(--font-display);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--yolk);color:var(--yolk-ink)}
.btn.ad{background:var(--sky);color:#fff}
.btn.ghost{background:var(--surface2);color:var(--ink)}
.btn.mini{min-height:36px;padding:6px 10px;font-size:13px;border-radius:10px}
.btn svg{width:12px;height:12px;flex:none}
.tag{font:600 10px var(--font-display);letter-spacing:.08em;text-transform:uppercase;border:1px solid currentColor;border-radius:4px;padding:1px 4px;opacity:.85}
.bar{position:relative;height:12px;border-radius:999px;background:var(--surface2);overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:var(--yolk);transition:width .25s}
.bar .mk{position:absolute;top:0;bottom:0;width:2px;background:var(--surface)}
.bar.sky>i{background:var(--sky)}
.num{font-variant-numeric:tabular-nums}
.big{font:700 28px/1 var(--font-display);font-variant-numeric:tabular-nums}
.grow{flex:1;min-width:0}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:3px;background:var(--surface2);border-radius:12px;padding:3px}
.seg button{border:0;border-radius:9px;padding:9px;min-height:40px;font:600 14px var(--font-display);background:transparent;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--surface);color:var(--ink)}
/* cenário */
.scenecard{padding:0;overflow:hidden;gap:0}
.scene{display:block;width:100%;height:auto}
.c-sun{fill:var(--sun)} .c-hill{fill:var(--hill)} .c-ground{fill:var(--ground)} .c-ground2{fill:var(--ground2)}
.c-barn{fill:var(--barn)} .c-roof{fill:var(--roof)} .c-roofgold{fill:var(--yolk)} .c-door{fill:var(--door)}
.c-silo{fill:var(--silo)} .c-wall{fill:var(--wall)} .c-glass{fill:var(--glass);fill-opacity:.8;stroke:var(--wall);stroke-width:1.5}
.c-fence{fill:var(--fence)} .c-blade{fill:var(--roof)} .c-sail{fill:var(--wall)} .c-x{stroke:var(--roof);stroke-width:2;fill:none}
.c-plant{fill:#3FA061} .c-egg{fill:var(--yolk)}
.spin{transform-origin:0 0;animation:spin 8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.petem{animation:bob 2.4s ease-in-out infinite}
.strip{display:flex;align-items:center;gap:12px;padding:12px 14px}
.lvbadge{width:52px;height:52px;border-radius:14px;background:var(--yolk);color:var(--yolk-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none;line-height:1}
.lvbadge small{font:600 10px var(--font-display);letter-spacing:.08em;text-transform:uppercase}
.lvbadge b{font:700 24px var(--font-display)}
/* pasto */
.field{background:var(--grass);border-radius:14px;padding:10px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.slot{aspect-ratio:1;border-radius:12px;background:var(--surface);border:2px solid var(--rc,var(--line));display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;min-width:0}
.slot .em{font-size:30px;line-height:1.1;display:block;animation:bob 2.4s ease-in-out infinite}
.slot .lvl{font:600 11px var(--font-display);color:var(--muted)}
.slot .rate{font:600 11px var(--font-display);color:var(--ink);font-variant-numeric:tabular-nums}
.slot.empty,.slot.lock{background:transparent;border:2px dashed var(--line);color:var(--muted);font:600 11px var(--font-display);text-align:center}
.slot.lock{opacity:.6}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
/* ovos */
.egg{display:flex;gap:12px;align-items:center}
.egg svg.eggsvg{width:52px;height:60px;flex:none}
.egg .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.chips{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;color:var(--muted)}
.chips b{color:var(--ink);font-weight:700}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;background:var(--rc)}
details summary{cursor:pointer;font:600 15px var(--font-display);min-height:32px;display:flex;align-items:center}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:right;padding:6px 4px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left}
th{font:600 12px var(--font-display);color:var(--muted)}
.scroll-x{overflow-x:auto}
/* álbum */
.cgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.cell{aspect-ratio:1;border-radius:12px;background:var(--surface);border:2px solid var(--rc);display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0}
.cell .em{font-size:30px;line-height:1.1}
.cell.off{border-style:dashed;border-color:var(--line)}
.cell.off .em{filter:brightness(0);opacity:.18}
.cell .nm{font:600 10px var(--font-display);color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-inline:2px}
.badge{font:600 12px var(--font-display);border-radius:999px;padding:2px 10px;background:var(--surface2);color:var(--muted)}
.badge.on{background:var(--yolk);color:var(--yolk-ink)}
/* missões e bônus */
.dd{width:100%;aspect-ratio:1;max-width:34px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font:600 12px var(--font-display);color:var(--muted)}
.dd.f{background:var(--yolk);border-color:var(--yolk);color:var(--yolk-ink)}
.dd.hoje{border-color:var(--yolk);color:var(--ink)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;justify-items:center}
/* guilda */
.field{display:block;width:100%;margin:8px 0;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);font:inherit}
.mrow{display:grid;grid-template-columns:24px minmax(0,1fr) auto auto;gap:8px;align-items:center;padding-block:6px;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:0}
.mrow.eu{background:color-mix(in srgb,var(--yolk) 18%,transparent);border-radius:10px;padding-inline:6px;margin-inline:-6px}
.mrow .pos{font:700 14px var(--font-display);color:var(--muted);text-align:center}
.mrow .who{display:flex;flex-direction:column;min-width:0}
.mrow .who b{font:600 15px var(--font-display);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow .who small{color:var(--muted);font-size:12px}
.mrow .pts{font:600 14px var(--font-display);text-align:right}
.chests{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.chest{border:2px solid var(--line);background:var(--surface2);color:var(--ink);border-radius:12px;padding:8px 4px;min-height:84px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:600 13px var(--font-display);cursor:pointer}
.chest small{font:600 11px var(--font-body);color:var(--muted)}
.chest.pronto{background:var(--yolk);border-color:var(--yolk);color:var(--yolk-ink)}
.chest.pronto small{color:var(--yolk-ink)}
.chest.ok{opacity:.55}
.chest:disabled{cursor:default}
.evt{display:flex;gap:10px;align-items:center;justify-content:space-between;padding-block:6px;border-bottom:1px solid var(--line)}
.evt:last-child{border-bottom:0}
.evt p{font-size:14px;min-width:0}
.evt small{color:var(--muted);font-size:12px;display:block}
/* painel */
.field-in{display:flex;flex-direction:column;gap:4px}
.field-in label{font:600 13px var(--font-display)}
.field-in input{font:600 16px var(--font-body);padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);min-height:44px;width:100%}
.kpi{display:flex;flex-direction:column;gap:2px}
/* modal e toast */
.modal{position:fixed;inset:0;background:rgba(5,15,10,.62);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;width:100%;max-width:360px;max-height:100%;overflow-y:auto;display:flex;flex-direction:column;gap:14px;text-align:center}
.reveal{display:flex;flex-direction:column;align-items:center;gap:6px}
.reveal .face{width:120px;height:120px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:64px;background:var(--surface2);border:4px solid var(--rc);box-shadow:0 0 0 6px color-mix(in srgb,var(--rc) 22%,transparent)}
.shake{animation:shake .5s ease-in-out infinite}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
.pop{animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.rlabel{font:700 13px var(--font-display);letter-spacing:.08em;text-transform:uppercase;color:var(--rc)}
.lvbig{font:700 56px/1 var(--font-display);color:var(--ink)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font:600 14px var(--font-display);z-index:20;max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion:reduce){
  .slot .em,.shake,.pop,.petem,.spin{animation:none}
  .bar>i{transition:none}
}
</style>

<div class="shell">
  <header class="top">
    <div class="brand">Sítio dos Bichos</div>
    <div class="wallet" aria-label="Saldo">
      <span class="chip" title="Moedas"><svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><circle cx="10" cy="10" r="9" fill="var(--yolk)"/><circle cx="10" cy="10" r="5.5" fill="none" stroke="var(--yolk-ink)" stroke-width="1.5" opacity=".5"/></svg><span id="vCoins">0</span></span>
      <span class="chip" title="Gemas"><svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><polygon points="10,1 18,8 10,19 2,8" fill="var(--sky)"/><polyline points="2,8 18,8" stroke="#fff" stroke-width="1.2" opacity=".6" fill="none"/></svg><span id="vGems">0</span></span>
      <button class="iconbtn" data-act="aba" data-arg="dev" aria-label="Painel de anúncios"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V11M12 20V4M19 20v-6"/></svg></button>
    </div>
  </header>
  <main id="view"></main>
  <nav id="nav" aria-label="Seções">
    <button data-act="aba" data-arg="sitio"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-7 9 7v9H3z"/><path d="M9 20v-6h6v6"/></svg>Sítio</button>
    <button data-act="aba" data-arg="ovos"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3C8 3 5 10 5 14.5 5 18.5 8 21 12 21s7-2.5 7-6.5C19 10 16 3 12 3z"/></svg>Ovos</button>
    <button data-act="aba" data-arg="obras"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l9-9"/><path d="M12 4l5 1 2 5-3 3-4-4z"/></svg>Obras</button>
    <button data-act="aba" data-arg="guilda"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M3 19c0-3 3-5 6-5s6 2 6 5M15 15c3 0 6 1.500 6 4"/></svg>Guilda</button>
    <button data-act="aba" data-arg="metas"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 6l2 2 3-3M5 14l2 2 3-3M13 7h6M13 15h6"/></svg>Metas</button>
  </nav>
</div>
<div id="modal" class="modal" hidden></div>
<div id="toast" class="toast" hidden role="status"></div>

<script id="logic">
/* ===== Regras do jogo (sem DOM) ===== */
const RARIDADES = [
  { id: 'comum',    nome: 'Comum',    prod: 0.5 },
  { id: 'incomum',  nome: 'Incomum',  prod: 1.5 },
  { id: 'raro',     nome: 'Raro',     prod: 4 },
  { id: 'epico',    nome: 'Épico',    prod: 12 },
  { id: 'lendario', nome: 'Lendário', prod: 40 }
];
const PETS = [
  { id: 'pintinho',  nome: 'Pintinho',           em: '🐥', r: 0 },
  { id: 'coelho',    nome: 'Coelho',             em: '🐰', r: 0 },
  { id: 'leitao',    nome: 'Leitão',             em: '🐷', r: 0 },
  { id: 'patinho',   nome: 'Patinho',            em: '🦆', r: 0 },
  { id: 'ovelha',    nome: 'Ovelha',             em: '🐑', r: 1 },
  { id: 'bezerra',   nome: 'Bezerra',            em: '🐮', r: 1 },
  { id: 'cabrito',   nome: 'Cabrito',            em: '🐐', r: 1 },
  { id: 'galinha',   nome: 'Galinha Caipira',    em: '🐔', r: 1 },
  { id: 'raposa',    nome: 'Raposa',             em: '🦊', r: 2 },
  { id: 'potro',     nome: 'Potro',              em: '🐴', r: 2 },
  { id: 'lhama',     nome: 'Lhama',              em: '🦙', r: 2 },
  { id: 'lontra',    nome: 'Lontra',             em: '🦦', r: 2 },
  { id: 'unicornio', nome: 'Unicórnio',          em: '🦄', r: 3 },
  { id: 'pavao',     nome: 'Pavão',              em: '🦚', r: 3 },
  { id: 'coruja',    nome: 'Coruja',             em: '🦉', r: 3 },
  { id: 'cervo',     nome: 'Cervo',              em: '🦌', r: 3 },
  { id: 'dragao',    nome: 'Dragão do Milharal', em: '🐲', r: 4 },
  { id: 'mamute',    nome: 'Mamute Lanoso',      em: '🦣', r: 4 },
  { id: 'dino',      nome: 'Dino de Palha',      em: '🦕', r: 4 }
];
const PET_POR_ID = Object.fromEntries(PETS.map(p => [p.id, p]));
const OVOS = {
  palha:   { nome: 'Ovo de Palha', moeda: 'coins', base: 120, tempo: 20, pesos: [60, 28, 9, 2.6, 0.4], nivel: 1 },
  dourado: { nome: 'Ovo Dourado',  moeda: 'gems',  base: 5,   tempo: 60, pesos: [0, 38, 40, 19, 3],    nivel: 5 }
};
const PITY_LIMIT = 30, PITY_PESOS = [0, 0, 0, 92, 8], LVL_MAX = 10;
const SLOTS_INI = 3, SLOTS_MAX = 8;
const PASTO_CUSTO = [500, 4000, 30000, 200000, 1500000];
const PASTO_NIVEL = [2, 4, 7, 10, 14];
const NIVEL_MAX = 30;
const XP_OVO = [8, 12, 25, 60, 200];
const SET_BONUS = [0.10, 0.20, 0.35, 0.60, 1.00];
const DIARIO = [{ k: 1, g: 0 }, { k: 0, g: 2 }, { k: 2, g: 0 }, { k: 0, g: 3 }, { k: 3, g: 0 }, { k: 0, g: 4 }, { k: 4, g: 8 }];
const TITULOS = [[1, 'Aprendiz de Roça'], [3, 'Peão Esperto'], [6, 'Sitiante'], [10, 'Fazendeiro'], [15, 'Capataz-Mor'], [20, 'Barão da Colheita'], [25, 'Duque dos Bichos'], [30, 'Lenda do Campo']];
const OBRAS = {
  celeiro:    { nome: 'Celeiro',    nivel: 1, max: 10, base: 150, cresc: 2.0 },
  chocadeira: { nome: 'Chocadeira', nivel: 2, max: 8,  base: 300, cresc: 2.1 },
  moinho:     { nome: 'Moinho',     nivel: 3, max: 10, base: 400, cresc: 2.2 },
  estufa:     { nome: 'Estufa',     nivel: 5, max: 10, base: 700, cresc: 2.15 }
};
const NIVEL_GUILDA = 5;

/* ----- tempo ----- */
let TZ_OFF = 0;
const HORA = 3600000, DIA = 86400000;
const diaDe = now => Math.floor((now - TZ_OFF * 60000) / DIA);
const semanaDe = now => Math.floor((diaDe(now) + 3) / 7);
const horasSemana = now => ((now - TZ_OFF * 60000) - (semanaDe(now) * 7 - 3) * DIA) / HORA;

/* ----- sorteio ----- */

/* ----- fórmulas ----- */
const horasCeleiro = l => 1 + 0.5 * l;

const tituloDe = l => TITULOS.filter(t => l >= t[0]).pop()[1];
const tierDe = l => Math.min(5, Math.floor((l - 1) / 5));
const incubadoras = n => 2 + (n >= 6 ? 1 : 0) + (n >= 12 ? 1 : 0);
const custoObra = (id, l) => Math.round(OBRAS[id].base * Math.pow(OBRAS[id].cresc, l));
const custoOvo = (S, id) => OVOS[id].moeda === 'coins' ? Math.round(OVOS[id].base * (1 + 0.2 * (S.nivel - 1)) * Math.pow(1.03, S.summons)) : OVOS[id].base;
const tempoOvo = (S, id) => Math.max(5, Math.round(OVOS[id].tempo * fatorChocar(S.obras.chocadeira)));
const metaSafra = n => Math.round(120 * Math.pow(1.2, n - 1));
function recSafra(n) { return { coins: Math.round(metaSafra(n) * 0.25), xp: 8 + 2 * n, gems: n % 10 === 0 ? 15 : n % 5 === 0 ? 5 : n % 3 === 0 ? 1 : 0 }; }
function prodPet(id, lvl) { return RARIDADES[PET_POR_ID[id].r].prod * (1 + 0.3 * (lvl - 1)); }
function ativos(S) {
  return Object.keys(S.pets)
    .map(id => ({ id, lvl: S.pets[id].lvl, prod: prodPet(id, S.pets[id].lvl) }))
    .sort((a, b) => b.prod - a.prod)

}
function setsCompletos(S) { return RARIDADES.map((_, r) => PETS.filter(p => p.r === r).every(p => S.pets[p.id])); }

function bonusGuildaProd(S) { return S.guilda.id >= 0 ? 0.04 * (S.guilda.nivel - 1) : 0; }
function prodBase(S) { return ativos(S).reduce((a, p) => a + p.prod, 0); }

function pastoProx(S) { return S.slots < SLOTS_MAX ? { custo: PASTO_CUSTO[S.slots - SLOTS_INI], nivel: PASTO_NIVEL[S.slots - SLOTS_INI] } : null; }
function desbloqueios(n) {

/* ----- pseudo-aleatório determinístico (jogadores simulados) ----- */

/* ----- guilda (jogadores simulados) ----- */

  { id: 0, nome: 'Liga do Celeiro',  lema: 'Um ovo novo por dia' },
  { id: 1, nome: 'Raposas da Roça',  lema: 'Espertas e sempre no pasto' },
  { id: 2, nome: 'Os Colhedores',    lema: 'Quem planta, colhe' }

const NOMES = ['Mari', 'Zé do Milho', 'Tati', 'Duda', 'Bento', 'Lia', 'Caco', 'Nina', 'Teco', 'Gabi', 'Rafa', 'Joaquim', 'Bia', 'Pipo', 'Dona Cida', 'Tonho', 'Léo', 'Sol', 'Vitória', 'Nando'];

const N_MEMBROS = 14;

const membroNome = (gid, i) => NOMES[(i + gid * 4) % NOMES.length];

const membroTaxa = (gid, i) => 0.8 + rnd01(gid * 100 + i, 1) * 3.4;
const pontosMembro = (gid, i, now) => Math.floor(membroTaxa(gid, i) * horasSemana(now));
const membroNivel = (S, i, now) => 4 + Math.floor(rnd01(S.guilda.id * 100 + i, 2) * 22) + Math.floor(Math.max(0, diaDe(now) - S.criadoDia) * 0.2);
function fundoGuilda(S, now) {

}
const fundoNivel = n => Math.round(2500 * Math.pow(1.7, n - 1));  // fundo necessário para passar do nível n para n+1
function nivelPorFundo(f) { let n = 1; while (n < 20 && f >= fundoNivel(n)) n++; return n; }
function atualizarGuilda(S, now) {
  const g = S.guilda; if (g.id < 0 || g.id >= GUILDAS.length) return;   // guilda online: o servidor manda
  g.nivel = nivelPorFundo(fundoGuilda(S, now));
  const sem = semanaDe(now);
  if (g.semana !== sem) { g.semana = sem; g.pontos = 0; g.baus = [0, 0, 0, 0]; }
}

let HOOK_PONTOS = null, HOOK_CHOQUE = null;
function addPontos(S, n, motivo) {

}
function membrosOrdenados(S, now) {

/* ranking dos sítios (jogadores simulados) */

const MISSOES_INI = [{ t: 'chocar', meta: 1 }, { t: 'coletar', meta: 100 }, { t: 'obra', meta: 1 }];

<script>

function carregar() {
  let s = null;

  const base = novoEstado(Date.now());
  if (!s || typeof s !== 'object') return base;
  const r = Object.assign(base, s);
  ['obras', 'cd', 'ads', 'dev', 'stats', 'diario', 'guilda'].forEach(k => { r[k] = Object.assign({}, base[k], s[k]); });
  if (!Array.isArray(r.eggs)) r.eggs = [null, null];
  if (!r.pets || typeof r.pets !== 'object') r.pets = {};
  if (!Array.isArray(r.missoes) || r.missoes.length !== 3) { r.missoes = [null, null, null]; for (let i = 0; i < 3; i++) r.missoes[i] = novaMissao(r); }
  r.missoes = r.missoes.map(m => m || novaMissao(r));
  if (r.guilda.id >= GUILDAS.length) r.guilda = base.guilda;   // sobra do modo online
  ajustarIncubadoras(r);

}

const fmt = n => n >= 1e6 ? (n / 1e6).toFixed(2).replace('.', ',') + ' mi' : Math.floor(n).toLocaleString('pt-BR');

const pct = n => n.toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + '%';
const usd = n => 'US$ ' + n.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const mmss = ms => { const s = Math.max(0, Math.ceil(ms / 1000)); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); };
const duracao = s => { s = Math.max(0, Math.round(s)); if (s < 60) return s + ' s'; if (s < 3600) return Math.round(s / 60) + ' min'; if (s < 86400) return Math.floor(s / 3600) + ' h ' + Math.round((s % 3600) / 60) + ' min'; return Math.floor(s / 86400) + ' d ' + Math.round((s % 86400) / 3600) + ' h'; };

/* ---------- modais ---------- */
const MODAL = $('#modal');

  const dur = 3000, ini = Date.now();
  clearInterval(adT);

    if (!bar) { clearInterval(adT); return; }

function abrirOvoUI(i) {

/* ---------- ações ---------- */
function processar(r, semDrenar) {
  if (r.ups.length) receber(r.ups);
  if (r.safras.length) {
    const c = r.safras.reduce((a, s) => a + s.rec.coins, 0);
    toast(r.safras.length === 1 ? `Safra ${r.safras[0].n} concluída! +${fmt(c)} moedas` : `${r.safras.length} safras concluídas! +${fmt(c)} moedas`);
  }
  if (!semDrenar) drenar();
}
const ACOES = {

  subG(x) { subG = x; render(); },

  pasto() { const r = comprarPasto(S); if (!r.ok) return toast(erroMsg(r)); receber(r.ups); salvar(); render(); toast('Novo pasto liberado'); },

  abrir(i) { abrirOvoUI(+i); },

  resgatar2x(i) {

  },
  diario() { const r = resgatarDiario(S, diaDe(Date.now()), false); if (!r) return; receber(r.ups); salvar(); render(); toast('Bônus do dia ' + r.seq + ': ' + textoRec({ coins: r.r.coins, gems: r.r.gems, xp: 0 })); },
  diario2x() {

  bau(i) { const r = resgatarBau(S, +i, Date.now()); if (!r.ok) return toast(erroMsg(r)); receber(r.ups); salvar(); render(); toast('Baú: +' + fmt(r.coins) + ' moedas, +' + r.gems + ' gemas'); },

/* ---------- cenário ---------- */
function avatarSVG(tier) {

  let s = '';
  if (tier >= 3) s += '<rect x="-14" y="-38" width="28" height="26" rx="5" fill="#2E7D4F"/>';
  s += '<rect x="-7" y="-14" width="5" height="14" rx="1" fill="#3A4A63"/><rect x="2" y="-14" width="5" height="14" rx="1" fill="#3A4A63"/>';
  s += `<rect x="-10" y="-37" width="20" height="25" rx="5" fill="${cam}"/><rect x="-13" y="-34" width="4" height="14" rx="2" fill="${cam}"/><rect x="9" y="-34" width="4" height="14" rx="2" fill="${cam}"/>`;
  if (tier >= 2) s += '<rect x="-6" y="-37" width="3" height="14" fill="#2C5E8C"/><rect x="3" y="-37" width="3" height="14" fill="#2C5E8C"/>';
  if (tier >= 4) s += '<rect x="-10" y="-20" width="20" height="4" fill="#F2C94C"/>';
  s += '<circle cx="0" cy="-45" r="8" fill="#F0C9A0"/><circle cx="-3" cy="-46" r="1" fill="#2B1D00"/><circle cx="3" cy="-46" r="1" fill="#2B1D00"/>';
  if (tier >= 5) s += '<polygon points="-8,-52 -8,-62 -4,-57 0,-64 4,-57 8,-62 8,-52" fill="#F4B31F"/>';
  else { s += '<ellipse cx="0" cy="-51" rx="14" ry="3.5" fill="#E8CF84"/><path d="M-8 -51 Q0 -64 8 -51Z" fill="#E8CF84"/>'; if (tier >= 1) s += `<rect x="-8" y="-54" width="16" height="2.5" fill="${cam}"/>`; }
  if (tier >= 1) s += '<polygon points="-5,-38 5,-38 0,-31" fill="#C8453A"/>';
  return s;
}
function cena() {

  g += `<g transform="translate(62 128) scale(${sb.toFixed(3)})"><rect x="-30" y="-46" width="60" height="46" class="c-barn"/><polygon points="-35,-46 0,-74 35,-46" class="${o.celeiro >= 10 ? 'c-roofgold' : 'c-roof'}"/><rect x="-9" y="-26" width="18" height="26" class="c-door"/><path d="M-9 -26L9 0M9 -26L-9 0" class="c-x"/><circle cx="0" cy="-54" r="4" class="c-door"/>${o.celeiro >= 5 ? '<rect x="36" y="-56" width="16" height="56" class="c-silo"/><ellipse cx="44" cy="-56" rx="8" ry="5" class="c-roof"/>' : ''}</g>`;
  if (o.chocadeira >= 1) { const s = 0.85 + 0.04 * o.chocadeira; g += `<g transform="translate(156 128) scale(${s.toFixed(3)})"><rect x="-20" y="-24" width="40" height="24" class="c-wall"/><polygon points="-24,-24 0,-44 24,-24" class="c-roof"/><rect x="-5" y="-14" width="10" height="14" class="c-door"/><ellipse cx="0" cy="-30" rx="4" ry="5" class="c-egg"/></g>`; }
  if (o.estufa >= 1) { const s = 0.85 + 0.04 * o.estufa; g += `<g transform="translate(224 128) scale(${s.toFixed(3)})"><path d="M-26 0 L-26 -16 Q0 -46 26 -16 L26 0Z" class="c-glass"/><path d="M0 0V-31M-13 0V-27M13 0V-27" class="c-x" style="stroke:var(--wall);stroke-width:1.2"/><circle cx="-12" cy="-5" r="4" class="c-plant"/><circle cx="0" cy="-6" r="4.5" class="c-plant"/><circle cx="12" cy="-5" r="4" class="c-plant"/></g>`; }
  if (o.moinho >= 1) { const s = 0.85 + 0.04 * o.moinho, d = Math.max(2.5, 9 - 0.65 * o.moinho).toFixed(1); g += `<g transform="translate(306 128) scale(${s.toFixed(3)})"><path d="M-10 0L10 0L6 -48L-6 -48Z" class="c-wall"/><path d="M-9 -48L0 -60L9 -48Z" class="c-roof"/><g transform="translate(0 -50)"><g class="spin" style="animation-duration:${d}s">${[0, 90, 180, 270].map(a => `<rect x="-1.5" y="-28" width="3" height="28" class="c-blade" transform="rotate(${a})"/><rect x="1.5" y="-28" width="9" height="14" class="c-sail" transform="rotate(${a})"/>`).join('')}</g></g></g>`; }

  const step = 240 / Math.max(n, 3);
  at.forEach((a, i) => { const x = 104 + i * step; g += `<ellipse cx="${x}" cy="176" rx="11" ry="3" class="c-ground2"/><text x="${x}" y="174" font-size="22" text-anchor="middle" class="petem" style="animation-delay:${(i * 0.3).toFixed(1)}s" font-family="'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif">${PET_POR_ID[a.id].em}</text>`; });
  g += `<g transform="translate(40 184)">${avatarSVG(tier)}</g>`;
  return `<svg class="scene" viewBox="0 0 360 190" role="img" aria-label="Seu sítio no nível ${S.nivel}"><defs><linearGradient id="cuSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--sky-a)"/><stop offset="1" style="stop-color:var(--sky-b)"/></linearGradient></defs><rect width="360" height="190" fill="url(#cuSky)"/><circle cx="322" cy="30" r="14" class="c-sun"/><path d="M0 122 Q60 92 130 112 T260 106 T360 114 V130 H0Z" class="c-hill"/><rect y="122" width="360" height="68" class="c-ground"/><path d="M0 150 Q90 142 180 150 T360 148 V190 H0Z" class="c-ground2"/>${g}</svg>`;
}

/* ---------- telas ---------- */

  return `<section class="card"><div class="between"><h2>Bônus diário</h2><span class="muted">Sequência: ${pronto ? seq - 1 : seq} dia(s)</span></div><div class="days">${dots}</div>
    ${pronto ? `<p class="muted">Dia ${seq}: <b>${textoRec({ coins: r.coins, gems: r.gems, xp: 0 })}</b></p><div class="row"><button class="btn primary" data-act="diario">Pegar</button><button class="btn ad" data-act="diario2x">${PLAY}Em dobro <span class="tag">Anúncio</span></button></div>` : '<p class="muted">Bônus de hoje recebido. Volte amanhã para manter a sequência. O dia 7 dá o maior prêmio.</p>'}</section>`;

function criarApi(sb) {
  // Chama uma função do servidor e normaliza o resultado.
  async function chamar(nome, args = {}) {
    let r;
    try {
      r = await sb.rpc(nome, args);
    } catch (e) {
      return falha('rede');
    }
    if (r.error) {
      const m = String(r.error.message || '');
      if (/nao_autenticado/.test(m) || r.error.code === '28000') return falha('nao_autenticado');
      return falha(/fetch|network|Failed/i.test(m) ? 'rede' : 'servidor', { detalhe: m });
    }
    const d = r.data;
    if (!d || d.ok !== true) return falha(d?.erro || 'servidor', d && d.versao !== undefined ? { versao: d.versao } : {});
    return d;
  }

  const inteiro = (n, min, max) => Math.min(max, Math.max(min, Math.floor(Number(n) || 0)));

  return {
    // Garante uma sessão (login anônimo) e cria/lê o perfil.
    async entrar(nome) {
      try {
        const { data } = await sb.auth.getSession();
        if (!data?.session) {
          const { error } = await sb.auth.signInAnonymously();
          if (error) return falha('rede', { detalhe: error.message });
        }
      } catch (e) { return falha('rede'); }
      return chamar('jogo_iniciar', { p_nome: String(nome || '').trim() });
    },
    perfilAtualizar: ({ nome = null, nivel, poder }) =>
      chamar('jogo_perfil_atualizar', { p_nome: nome, p_nivel: inteiro(nivel, 1, 30), p_poder: inteiro(poder, 0, Number.MAX_SAFE_INTEGER) }),
    save: {
      carregar: () => chamar('jogo_save_carregar'),
      // versao = a que veio do último carregar/salvar (0 se ainda não existe save).
      salvar: (dados, versao) => chamar('jogo_save_salvar', { p_dados: dados, p_versao: inteiro(versao, 0, 2147483647) }),
    },
    guilda: {
      listar: () => chamar('jogo_guildas_listar'),
      criar: (nome, lema = '') => chamar('jogo_guilda_criar', { p_nome: String(nome || '').trim(), p_lema: String(lema || '').trim() }),
      entrar: id => chamar('jogo_guilda_entrar', { p_guilda: id }),
      sair: () => chamar('jogo_guilda_sair'),
      estado: () => chamar('jogo_guilda_estado'),
      // Corta o valor no teto do motivo, como o servidor faz, para não gastar chamada à toa.
      contribuir(pontos, motivo) {
        const teto = TETOS[motivo];
        if (!teto) return Promise.resolve(falha('motivo_invalido'));
        const p = inteiro(pontos, 0, teto);
        if (p < 1) return Promise.resolve(falha('pontos_invalidos'));
        return chamar('jogo_contribuir', { p_pontos: p, p_motivo: motivo });
      },
      doar: valor => chamar('jogo_guilda_doar', { p_valor: inteiro(valor, 0, 1e12) }),
      ajudar: alvo => chamar('jogo_guilda_ajudar', { p_alvo: alvo }),
      resgatarBau: indice => chamar('jogo_bau_resgatar', { p_indice: indice }),
    },
    mural: {
      postar: (tipo, params) => chamar('jogo_mural_postar', { p_tipo: tipo, p_params: params }),
      parabenizar: id => chamar('jogo_mural_parabenizar', { p_mural: id }),
    },
    ranking: (limite = 50) => chamar('jogo_ranking', { p_limite: inteiro(limite, 1, 100) }),
  };
}

  if (!r) return faixa() + '<section class="card"><p class="muted">Carregando o ranking…</p></section>';
  const acima = r.eu.pos && r.eu.pos > 1 ? r.top.find(x => x.pos === r.eu.pos - 1) : null;
  const linha = x => `<div class="mrow ${x.voce ? 'eu' : ''}"><span class="pos">${x.pos}</span><span class="who"><b>${esc(x.nome)}</b><small>Nv ${x.nivel}</small></span><span class="pts num">${fmt(x.poder)}</span><span></span></div>`;
  return faixa() + `<section class="card"><div class="between"><h2>Ranking dos sítios</h2><span class="badge on">${r.eu.pos ? r.eu.pos + 'º de ' + r.total : 'sem posição'}</span></div>
      <p class="muted">Poder do seu sítio: <b>${fmt(poderJogador(S))}</b>${acima ? `. Faltam ${fmt(acima.poder - r.eu.poder + 1)} para passar ${esc(acima.nome)}.` : r.eu.pos === 1 ? '. Você lidera o ranking.' : '.'}</p>
      <p class="muted">O poder soma produção, nível do fazendeiro, bichos descobertos e safras. Seu poder é enviado ao servidor a cada minuto.</p></section>
    <section class="card">${r.top.map(linha).join('')}</section>`;
}
function onBauPronto() {
  const e = ON.e; if (!e || !e.guilda) return false;
  const w = e.semana; return w.meus_pontos >= MIN_PONTOS_BAU && BAUS.some((b, i) => !w.baus.includes(i) && w.total >= b.p * w.meta);
}

/* ---------- ações ---------- */
async function agir(fn) {
  if (ON.busy) return; ON.busy = true;
  try { await fn(); } finally { ON.busy = false; }
  salvar(); render(); drenar();
}
const falhou = r => { toast(r.mensagem || 'Não foi possível'); return false; };
Object.assign(ACOES, {
  gEntrar: id => agir(async () => { const r = await api.guilda.entrar(id); if (!r.ok) return falhou(r); receber(ganharXP(S, 40)); await onGuilda(); toast('Bem-vindo à guilda!'); }),
  gCriar: () => agir(async () => { const r = await api.guilda.criar($('#gNome').value, $('#gLema').value); if (!r.ok) return falhou(r); receber(ganharXP(S, 40)); await onGuilda(); toast('Guilda criada!'); }),
  gSair: () => { if (!ON.confirmaSair) { ON.confirmaSair = true; render(); setTimeout(() => { ON.confirmaSair = false; if (aba === 'guilda') render(); }, 4000); return; }
    ON.confirmaSair = false; return agir(async () => { const r = await api.guilda.sair(); if (!r.ok) return falhou(r); await onGuilda(); await onLista(); toast('Você saiu da guilda'); }); },
  gDoar: p => agir(async () => {
    const v = Math.floor(S.coins * (+p) / 100); if (v < 100) return toast('Doe pelo menos 100 moedas');
    const r = await api.guilda.doar(v); if (!r.ok) return falhou(r);
    S.coins = Math.max(0, S.coins - v); S.guilda.doado += v; receber(ganharXP(S, Math.ceil(Math.sqrt(v) / 2)));
    await onGuilda(); toast('Doou ' + fmt(v) + ' moedas ao fundo');
  }),
  gAjudar: id => agir(async () => {
    const r = await api.guilda.ajudar(id); if (!r.ok) return falhou(r);
    const coins = Math.max(30, Math.round(prodTotal(S) * 60)); S.coins += coins; receber(ganharXP(S, 5));
    await onGuilda(); toast('Você ajudou um vizinho: +' + fmt(coins) + ' moedas');
  }),
  gBau: i => agir(async () => {
    const r = await api.guilda.resgatarBau(+i); if (!r.ok) return falhou(r);
    const b = BAUS[+i], coins = b.k * Math.max(200, Math.round(prodTotal(S) * 600));
    S.coins += coins; S.gems += b.g; receber(ganharXP(S, 30 + 10 * +i));
    await onGuilda(); toast('Baú: +' + fmt(coins) + ' moedas, +' + b.g + ' gemas');
  }),
  gParab: id => agir(async () => {
    const r = await api.mural.parabenizar(+id); if (!r.ok) return falhou(r);
    const coins = Math.max(20, Math.round(prodTotal(S) * 30)); S.coins += coins;
    await onGuilda(); toast('Parabéns enviado: +' + fmt(coins) + ' moedas');
  }),
});
{ const aba0 = ACOES.aba, sub0 = ACOES.subG;
  ACOES.aba = a => { aba0(a); if (a === 'guilda') visitar(true); };
  ACOES.subG = x => { sub0(x); visitar(true); }; }

onlineIniciar();

setInterval(tick, 250);
document.addEventListener('visibilitychange', () => { if (document.hidden) salvar(); else tick(); });
</script>
