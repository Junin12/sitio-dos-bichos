<title>Sítio dos Bichos</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Mulish:wght@400;600;700;800&display=swap">
<style>
/* Sítio dos Bichos: visual. App de uma coluna (até 480px): HUD no topo, conteúdo rolável e barra de 5 abas flutuante. */
:root{
  --bg:#E3F4E6; --bg2:#C9EAFB; --surface:#FFFFFF; --surface2:#EEF7F0; --ink:#17361F; --muted:#587360; --line:#D3E6D8;
  --yolk:#FFC21A; --yolk2:#FFD65E; --yolk-d:#D98F00; --yolk-ink:#4A2F00;
  --green:#3DBB6B; --green2:#6FD38F; --green-d:#23904C;
  --sky:#2F9BE8; --sky2:#62B9F5; --sky-d:#1B6FB5;
  --good:#23834A; --bad:#E5483B;
  --r0:#8FA39A; --r1:#33B167; --r2:#2F9BE8; --r3:#9B5CF0; --r4:#FF9F0A;
  --shadow:0 2px 0 rgba(23,54,31,.05),0 14px 28px -16px rgba(23,54,31,.35);
  --font-display:'Fredoka',system-ui,sans-serif; --font-body:'Mulish',system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1A12; --bg2:#10243A; --surface:#15281D; --surface2:#1F3626; --ink:#E6F3EA; --muted:#9DB9A8; --line:#2B4636;
    --good:#4FC17F; --bad:#FF7A6E; --shadow:0 2px 0 rgba(0,0,0,.25),0 14px 28px -16px rgba(0,0,0,.7);
    --r0:#A3B7AC; --r1:#4FC17F; --r2:#5DB4F0; --r3:#B18BF2; --r4:#FFB43A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1A12; --bg2:#10243A; --surface:#15281D; --surface2:#1F3626; --ink:#E6F3EA; --muted:#9DB9A8; --line:#2B4636;
  --good:#4FC17F; --bad:#FF7A6E; --shadow:0 2px 0 rgba(0,0,0,.25),0 14px 28px -16px rgba(0,0,0,.7);
  --r0:#A3B7AC; --r1:#4FC17F; --r2:#5DB4F0; --r3:#B18BF2; --r4:#FFB43A;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:linear-gradient(180deg,var(--bg2) 0,var(--bg) 240px,var(--bg) 100%) fixed;color:var(--ink);font:15px/1.45 var(--font-body);overscroll-behavior:none;user-select:none;-webkit-user-select:none}
h1,h2,h3,p{margin:0}
button{font-family:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.shell{display:flex;flex-direction:column;height:100%;max-width:480px;margin:0 auto;position:relative}

/* HUD */
.top{display:flex;align-items:center;gap:10px;padding:max(10px,env(safe-area-inset-top)) 14px 8px}
.lvring{--p:0;position:relative;width:50px;height:50px;border-radius:50%;flex:none;background:conic-gradient(var(--yolk) calc(var(--p)*1%),color-mix(in srgb,var(--ink) 14%,transparent) 0);display:grid;place-items:center;box-shadow:0 3px 0 var(--yolk-d),0 8px 14px -8px rgba(0,0,0,.4)}
.lvring::before{content:'';position:absolute;inset:5px;border-radius:50%;background:linear-gradient(160deg,var(--green2),var(--green-d))}
.lvring b{position:relative;font:700 21px var(--font-display);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.hudwho{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.hudwho b{font:600 15px/1 var(--font-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xpmini{height:8px;border-radius:99px;background:color-mix(in srgb,var(--ink) 13%,transparent);overflow:hidden}
.xpmini i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--yolk),var(--yolk2));transition:width .4s}
.wallet{display:flex;gap:6px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border-radius:999px;padding:5px 12px 5px 6px;font:600 15px var(--font-display);font-variant-numeric:tabular-nums;box-shadow:0 2px 0 var(--line),var(--shadow);transition:transform .15s}
.chip.bump{transform:scale(1.14)}
.chip svg{width:22px;height:22px;flex:none}
.iconbtn{width:38px;height:38px;border-radius:12px;border:0;background:var(--surface);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 2px 0 var(--line),var(--shadow)}
.iconbtn:active{transform:translateY(2px)}
.iconbtn svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

main{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:6px 14px 118px;display:flex;flex-direction:column;gap:14px;scrollbar-width:none}
main::-webkit-scrollbar{display:none}
main>*{flex:none}
main.in>*{animation:subir .38s cubic-bezier(.2,.9,.3,1) both}
main.in>*:nth-child(2){animation-delay:.04s} main.in>*:nth-child(3){animation-delay:.08s} main.in>*:nth-child(4){animation-delay:.12s} main.in>*:nth-child(n+5){animation-delay:.16s}
@keyframes subir{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* barra de abas flutuante */
nav{position:absolute;left:12px;right:12px;bottom:max(10px,env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,1fr);gap:2px;padding:6px;border-radius:26px;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 3px 0 var(--line),0 18px 34px -14px rgba(10,40,20,.5);z-index:5}
nav button{position:relative;background:none;border:0;border-radius:20px;color:var(--muted);font:600 11.5px var(--font-display);letter-spacing:.02em;padding:7px 0 6px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;min-height:54px;transition:color .2s,background .2s,transform .15s}
nav button.on{color:#fff;background:linear-gradient(160deg,var(--green2),var(--green-d));box-shadow:0 3px 0 #1c7a3f;transform:translateY(-3px)}
nav button:active{transform:scale(.94)}
nav button.has::after{content:'';position:absolute;top:5px;right:calc(50% - 30px);width:11px;height:11px;border-radius:50%;background:var(--bad);border:2px solid var(--surface);animation:pulsa 1.6s infinite}
nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
@keyframes pulsa{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}

/* cartões */
.card{background:var(--surface);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:0 3px 0 var(--line),var(--shadow)}
.card .card{box-shadow:none;background:var(--surface2);border-radius:18px}
.card.lock{opacity:.65}
.eyebrow{font:600 12px var(--font-display);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
h2{font:600 19px/1.2 var(--font-display)}
h3{font:600 16px/1.2 var(--font-display)}
.muted{color:var(--muted);font-size:13px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 140px;min-width:0}
.between{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.num{font-variant-numeric:tabular-nums}
.big{font:700 28px/1 var(--font-display);font-variant-numeric:tabular-nums}
.grow{flex:1;min-width:0}

/* botões 3D */
.btn{--c1:var(--surface2);--c2:var(--surface2);--cd:var(--line);border:0;border-radius:16px;padding:10px 16px;min-height:48px;font:600 16px var(--font-display);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center;background:linear-gradient(180deg,var(--c1),var(--c2));color:var(--ink);box-shadow:0 4px 0 var(--cd),0 10px 16px -10px rgba(0,0,0,.35);transition:transform .08s,box-shadow .08s,filter .2s}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--cd)}
.btn:disabled{filter:grayscale(.85) opacity(.55);cursor:not-allowed;box-shadow:0 3px 0 var(--line)}
.btn.primary{--c1:var(--yolk2);--c2:var(--yolk);--cd:var(--yolk-d);color:var(--yolk-ink)}
.btn.good{--c1:var(--green2);--c2:var(--green);--cd:var(--green-d);color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.2)}
.btn.ad{--c1:var(--sky2);--c2:var(--sky);--cd:var(--sky-d);color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.2)}
.btn.ghost{--c1:var(--surface2);--c2:var(--surface2);--cd:var(--line)}
.btn.mini{min-height:38px;padding:6px 12px;font-size:14px;border-radius:12px;box-shadow:0 3px 0 var(--cd)}
.btn.xl{min-height:60px;font-size:20px;border-radius:20px}
.btn svg{width:13px;height:13px;flex:none}
.tag{font:700 9.5px var(--font-display);letter-spacing:.08em;text-transform:uppercase;background:rgba(255,255,255,.28);border-radius:6px;padding:2px 5px}

/* barras */
.bar{position:relative;height:14px;border-radius:999px;background:color-mix(in srgb,var(--ink) 11%,transparent);overflow:hidden}
.bar>i{display:block;height:100%;width:0;border-radius:999px;background:linear-gradient(180deg,var(--yolk2),var(--yolk));transition:width .35s cubic-bezier(.3,.9,.3,1);position:relative}
.bar>i::after{content:'';position:absolute;inset:2px 6px auto;height:4px;border-radius:99px;background:rgba(255,255,255,.45)}
.bar .mk{position:absolute;top:0;bottom:0;width:3px;background:var(--surface)}
.bar.sky>i{background:linear-gradient(180deg,var(--sky2),var(--sky))}
.bar.green>i{background:linear-gradient(180deg,var(--green2),var(--green))}

.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:color-mix(in srgb,var(--ink) 9%,transparent);border-radius:16px;padding:4px}
.seg button{border:0;border-radius:12px;padding:9px;min-height:42px;font:600 15px var(--font-display);background:transparent;color:var(--muted);cursor:pointer;transition:all .2s}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 2px 0 var(--line)}

/* cena do sítio */
.scenecard{padding:0;overflow:hidden;gap:0;position:relative;border-radius:26px;background:#9fd6f7}
#cenaHost{display:block;width:100%;aspect-ratio:360/292;position:relative}
#cenaHost canvas{display:block;width:100%;height:100%;touch-action:manipulation}
.cenatop{position:absolute;left:10px;right:10px;top:10px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}
.pill{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.82);color:#17361F;border-radius:999px;padding:5px 11px;font:600 13px var(--font-display);font-variant-numeric:tabular-nums;box-shadow:0 2px 6px rgba(0,0,0,.15);backdrop-filter:blur(6px)}
.pill.dark{background:rgba(16,40,26,.72);color:#fff}
.cenabot{position:absolute;left:12px;right:12px;bottom:12px;display:flex;gap:8px;align-items:stretch}
.cenabot .btn.xl{flex:1;flex-direction:column;gap:0;line-height:1.1;padding:6px 14px}
.cenabot .btn.xl small{font:600 12px var(--font-body);opacity:.8}
.cenabot .btn.ad{min-width:76px;flex:none;flex-direction:column;gap:2px;font-size:15px}
.safra{display:flex;align-items:center;gap:10px}
.safra .bar{flex:1}

/* próximo passo */
.guia{flex-direction:row;align-items:center;gap:12px;background:linear-gradient(135deg,#FFF6D2,#FFE9A3);color:#4A2F00;box-shadow:0 3px 0 #E8C25A,var(--shadow);position:relative;overflow:hidden}
:root[data-theme="dark"] .guia,:root:not([data-theme="light"]) .guia{--gd:1}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .guia{background:linear-gradient(135deg,#3b3210,#4d3f12);color:#FFEFB3;box-shadow:0 3px 0 #6b5818,var(--shadow)}}
:root[data-theme="dark"] .guia{background:linear-gradient(135deg,#3b3210,#4d3f12);color:#FFEFB3;box-shadow:0 3px 0 #6b5818,var(--shadow)}
.guia .gic{font-size:34px;line-height:1;flex:none;animation:bob 2.2s ease-in-out infinite}
.guia .gtx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.guia .gtx b{font:600 16px/1.2 var(--font-display)}
.guia .gtx span{font-size:13px;opacity:.8}
.guia .btn{flex:none;min-width:92px}
.guia::after{content:'';position:absolute;inset:0;background:linear-gradient(110deg,transparent 40%,rgba(255,255,255,.4) 50%,transparent 60%);transform:translateX(-120%);animation:brilho 4.5s infinite;pointer-events:none}
@keyframes brilho{0%,60%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}

/* bicho no pasto */
.field{background:linear-gradient(180deg,#BDE8C4,#9ED7A9);border-radius:20px;padding:10px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
:root[data-theme="dark"] .field{background:linear-gradient(180deg,#1d4630,#17382a)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .field{background:linear-gradient(180deg,#1d4630,#17382a)}}
.slot{aspect-ratio:1;border-radius:16px;background:var(--surface);border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;min-width:0;box-shadow:inset 0 0 0 3px var(--rc,var(--line)),0 3px 0 color-mix(in srgb,var(--rc,var(--line)) 60%,#000 0%);overflow:hidden}
.slot::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 50% 30%,color-mix(in srgb,var(--rc) 28%,transparent),transparent 70%)}
.slot .em{font-size:30px;line-height:1.1;display:block;animation:bob 2.4s ease-in-out infinite;position:relative}
.slot .lvl{font:600 11px var(--font-display);color:var(--muted);position:relative}
.slot .rate{font:600 11px var(--font-display);color:var(--ink);font-variant-numeric:tabular-nums;position:relative}
.slot.empty,.slot.lock{background:transparent;box-shadow:none;border:2px dashed rgba(0,0,0,.18);color:var(--muted);font:600 11px var(--font-display);text-align:center}
.slot.empty::before,.slot.lock::before{display:none}
.slot.lock{opacity:.6}

/* ovos */
.egg{display:flex;gap:14px;align-items:center}
.egg svg.eggsvg{width:58px;height:68px;flex:none;filter:drop-shadow(0 6px 4px rgba(0,0,0,.18))}
.egg.pronto svg.eggsvg{animation:balanca 1.1s ease-in-out infinite;transform-origin:50% 90%}
@keyframes balanca{0%,100%{transform:rotate(0)}20%{transform:rotate(-9deg)}40%{transform:rotate(8deg)}60%{transform:rotate(-5deg)}80%{transform:rotate(3deg)}}
.egg .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.chips{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;color:var(--muted)}
.chips b{color:var(--ink);font-weight:700}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;background:var(--rc)}
details summary{cursor:pointer;font:600 15px var(--font-display);min-height:34px;display:flex;align-items:center}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:right;padding:7px 4px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left}
th{font:600 12px var(--font-display);color:var(--muted)}
.scroll-x{overflow-x:auto}

/* álbum */
.cgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.cell{aspect-ratio:1;border-radius:16px;background:var(--surface);box-shadow:inset 0 0 0 3px var(--rc);display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0;position:relative;overflow:hidden}
.cell::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 50% 30%,color-mix(in srgb,var(--rc) 25%,transparent),transparent 70%)}
.cell .em{font-size:30px;line-height:1.1;position:relative}
.cell.off{box-shadow:inset 0 0 0 2px var(--line);background:var(--surface2)}
.cell.off::before{display:none}
.cell.off .em{filter:brightness(0);opacity:.16}
.cell .nm{font:600 10px var(--font-display);color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-inline:2px;position:relative}
.badge{font:600 12px var(--font-display);border-radius:999px;padding:3px 11px;background:color-mix(in srgb,var(--ink) 10%,transparent);color:var(--muted)}
.badge.on{background:var(--yolk);color:var(--yolk-ink)}

/* bônus diário e missões */
.dd{width:100%;aspect-ratio:1;max-width:38px;border-radius:50%;border:0;background:color-mix(in srgb,var(--ink) 10%,transparent);display:flex;align-items:center;justify-content:center;font:600 13px var(--font-display);color:var(--muted)}
.dd.f{background:linear-gradient(180deg,var(--yolk2),var(--yolk));color:var(--yolk-ink);box-shadow:0 2px 0 var(--yolk-d)}
.dd.hoje{box-shadow:0 0 0 3px var(--yolk);color:var(--ink);animation:pulsa 1.6s infinite}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;justify-items:center}

/* guilda */
.mrow{display:grid;grid-template-columns:26px minmax(0,1fr) auto auto;gap:8px;align-items:center;padding-block:7px;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:0}
.mrow.eu{background:color-mix(in srgb,var(--yolk) 24%,transparent);border-radius:14px;padding-inline:8px;margin-inline:-8px;border-bottom-color:transparent}
.mrow .pos{font:700 14px var(--font-display);color:var(--muted);text-align:center}
.mrow .who{display:flex;flex-direction:column;min-width:0;flex:none}
.mrow .who b{font:600 15px var(--font-display);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow .who small{color:var(--muted);font-size:12px}
.mrow .pts{font:600 14px var(--font-display);text-align:right}
.chests{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.chest{border:0;background:var(--surface2);color:var(--ink);border-radius:16px;padding:8px 4px;min-height:92px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:600 14px var(--font-display);cursor:pointer;box-shadow:inset 0 0 0 2px var(--line),0 3px 0 var(--line)}
.chest::before{content:'🎁';font-size:24px;filter:grayscale(1) opacity(.5)}
.chest small{font:600 11px var(--font-body);color:var(--muted)}
.chest.pronto{background:linear-gradient(180deg,var(--yolk2),var(--yolk));box-shadow:0 4px 0 var(--yolk-d);color:var(--yolk-ink);animation:balanca 1.4s ease-in-out infinite}
.chest.pronto::before{filter:none}
.chest.pronto small{color:var(--yolk-ink)}
.chest.ok{opacity:.55}
.chest.ok::before{content:'✅';filter:none}
.chest:disabled{cursor:default}
.evt{display:flex;gap:10px;align-items:center;justify-content:space-between;padding-block:7px;border-bottom:1px solid var(--line)}
.evt:last-child{border-bottom:0}
.evt p{font-size:14px;min-width:0}
.evt small{color:var(--muted);font-size:12px;display:block}
.inp{display:block;width:100%;margin:8px 0;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--surface2);color:var(--ink);font:600 16px var(--font-body);user-select:text;-webkit-user-select:text}
.inp:focus{border-color:var(--sky);outline:0}

/* painel */
.field-in{display:flex;flex-direction:column;gap:4px}
.field-in label{font:600 13px var(--font-display)}
.field-in input{font:600 16px var(--font-body);padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--surface2);color:var(--ink);min-height:46px;width:100%;user-select:text;-webkit-user-select:text}
.kpi{display:flex;flex-direction:column;gap:2px}

/* modais, aviso e botão flutuante */
.modal{position:fixed;inset:0;background:rgba(6,20,12,.66);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:16px;z-index:40;animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{background:var(--surface);border-radius:28px;padding:22px;width:100%;max-width:360px;max-height:100%;overflow-y:auto;display:flex;flex-direction:column;gap:14px;text-align:center;box-shadow:0 5px 0 var(--line),0 30px 60px -20px rgba(0,0,0,.6);position:relative}
.reveal{display:flex;flex-direction:column;align-items:center;gap:6px;position:relative}
.reveal .rays{position:absolute;top:-40px;left:50%;width:300px;height:300px;margin-left:-150px;background:repeating-conic-gradient(from 0deg,color-mix(in srgb,var(--rc) 38%,transparent) 0 10deg,transparent 10deg 20deg);-webkit-mask:radial-gradient(circle,#000 18%,transparent 68%);mask:radial-gradient(circle,#000 18%,transparent 68%);animation:gira 9s linear infinite;pointer-events:none}
@keyframes gira{to{transform:rotate(360deg)}}
.reveal .face{position:relative;width:132px;height:132px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:72px;background:radial-gradient(circle at 35% 30%,var(--surface),var(--surface2));box-shadow:0 0 0 5px var(--rc),0 0 0 11px color-mix(in srgb,var(--rc) 25%,transparent),0 0 40px color-mix(in srgb,var(--rc) 55%,transparent)}

<script id="logic">
/* ===== Regras do jogo (sem DOM) ===== */
const RARIDADES = [
  { id: 'comum',    nome: 'Comum',    prod: 0.5 },
  { id: 'incomum',  nome: 'Incomum',  prod: 1.5 },
  { id: 'raro',     nome: 'Raro',     prod: 4 },
  { id: 'epico',    nome: 'Épico',    prod: 12 },
  { id: 'lendario', nome: 'Lendário', prod: 40 }

const PETS = [
  { id: 'pintinho',  nome: 'Pintinho',           em: '🐥', r: 0 },
  { id: 'coelho',    nome: 'Coelho',             em: '🐰', r: 0 },
  { id: 'leitao',    nome: 'Leitão',             em: '🐷', r: 0 },
  { id: 'patinho',   nome: 'Patinho',            em: '🦆', r: 0 },
  { id: 'ovelha',    nome: 'Ovelha',             em: '🐑', r: 1 },
  { id: 'bezerra',   nome: 'Bezerra',            em: '🐮', r: 1 },
  { id: 'cabrito',   nome: 'Cabrito',            em: '🐐', r: 1 },
  { id: 'galinha',   nome: 'Galinha Caipira',    em: '🐔', r: 1 },
  { id: 'raposa',    nome: 'Raposa',             em: '🦊', r: 2 },
  { id: 'potro',     nome: 'Potro',              em: '🐴', r: 2 },
  { id: 'lhama',     nome: 'Lhama',              em: '🦙', r: 2 },
  { id: 'lontra',    nome: 'Lontra',             em: '🦦', r: 2 },
  { id: 'unicornio', nome: 'Unicórnio',          em: '🦄', r: 3 },
  { id: 'pavao',     nome: 'Pavão',              em: '🦚', r: 3 },
  { id: 'coruja',    nome: 'Coruja',             em: '🦉', r: 3 },
  { id: 'cervo',     nome: 'Cervo',              em: '🦌', r: 3 },
  { id: 'dragao',    nome: 'Dragão do Milharal', em: '🐲', r: 4 },
  { id: 'mamute',    nome: 'Mamute Lanoso',      em: '🦣', r: 4 },
  { id: 'dino',      nome: 'Dino de Palha',      em: '🦕', r: 4 }
];
const PET_POR_ID = Object.fromEntries(PETS.map(p => [p.id, p]));
const OVOS = {
  palha:   { nome: 'Ovo de Palha', moeda: 'coins', base: 120, tempo: 20, pesos: [60, 28, 9, 2.6, 0.4], nivel: 1 },
  dourado: { nome: 'Ovo Dourado',  moeda: 'gems',  base: 5,   tempo: 60, pesos: [0, 38, 40, 19, 3],    nivel: 5 }
};
const PITY_LIMIT = 30, PITY_PESOS = [0, 0, 0, 92, 8], LVL_MAX = 10;
const SLOTS_INI = 3, SLOTS_MAX = 8;
const PASTO_CUSTO = [500, 4000, 30000, 200000, 1500000];
const PASTO_NIVEL = [2, 4, 7, 10, 14];
const NIVEL_MAX = 30;
const XP_OVO = [8, 12, 25, 60, 200];
const SET_BONUS = [0.10, 0.20, 0.35, 0.60, 1.00];
const DIARIO = [{ k: 1, g: 0 }, { k: 0, g: 2 }, { k: 2, g: 0 }, { k: 0, g: 3 }, { k: 3, g: 0 }, { k: 0, g: 4 }, { k: 4, g: 8 }];
const TITULOS = [[1, 'Aprendiz de Roça'], [3, 'Peão Esperto'], [6, 'Sitiante'], [10, 'Fazendeiro'], [15, 'Capataz-Mor'], [20, 'Barão da Colheita'], [25, 'Duque dos Bichos'], [30, 'Lenda do Campo']];
const OBRAS = {
  celeiro:    { nome: 'Celeiro',    nivel: 1, max: 10, base: 150, cresc: 2.0 },
  chocadeira: { nome: 'Chocadeira', nivel: 2, max: 8,  base: 300, cresc: 2.1 },
  moinho:     { nome: 'Moinho',     nivel: 3, max: 10, base: 400, cresc: 2.2 },
  estufa:     { nome: 'Estufa',     nivel: 5, max: 10, base: 700, cresc: 2.15 }
};
const NIVEL_GUILDA = 5;

/* ----- tempo ----- */
let TZ_OFF = 0;
const HORA = 3600000, DIA = 86400000;
const diaDe = now => Math.floor((now - TZ_OFF * 60000) / DIA);
const semanaDe = now => Math.floor((diaDe(now) + 3) / 7);
const horasSemana = now => ((now - TZ_OFF * 60000) - (semanaDe(now) * 7 - 3) * DIA) / HORA;

/* ----- sorteio ----- */
function sortearRaridade(pesos, pity, rng) {
  rng = rng || Math.random;
  const p = pity >= PITY_LIMIT - 1 ? PITY_PESOS : pesos;
  const t = p.reduce((a, b) => a + b, 0);
  let x = rng() * t;
  for (let i = 0; i < p.length; i++) { if (x < p[i]) return i; x -= p[i]; }
  return p.length - 1;
}
function sortearPet(ovoId, pity, rng) {
  rng = rng || Math.random;
  const r = sortearRaridade(OVOS[ovoId].pesos, pity, rng);
  const lista = PETS.filter(p => p.r === r);
  return { r, pet: lista[Math.floor(rng() * lista.length)] };
}

/* ----- fórmulas ----- */
const horasCeleiro = l => 1 + 0.5 * l;
const multMoinho = l => 1 + 0.1 * l;
const fatorChocar = l => Math.max(0.36, 1 - 0.08 * l);
const multXP = l => 1 + 0.1 * l;
const xpProx = l => Math.round(60 * Math.pow(1.45, l - 1));
const nivelParaObra = l => 3 * l + 1;   // nível do fazendeiro para subir a obra do nível l para l+1
const tituloDe = l => TITULOS.filter(t => l >= t[0]).pop()[1];
const tierDe = l => Math.min(5, Math.floor((l - 1) / 5));
const incubadoras = n => 2 + (n >= 6 ? 1 : 0) + (n >= 12 ? 1 : 0);
const custoObra = (id, l) => Math.round(OBRAS[id].base * Math.pow(OBRAS[id].cresc, l));
const custoOvo = (S, id) => OVOS[id].moeda === 'coins' ? Math.round(OVOS[id].base * (1 + 0.2 * (S.nivel - 1)) * Math.pow(1.03, S.summons)) : OVOS[id].base;
const tempoOvo = (S, id) => Math.max(5, Math.round(OVOS[id].tempo * fatorChocar(S.obras.chocadeira)));
const metaSafra = n => Math.round(120 * Math.pow(1.2, n - 1));
function recSafra(n) { return { coins: Math.round(metaSafra(n) * 0.25), xp: 8 + 2 * n, gems: n % 10 === 0 ? 15 : n % 5 === 0 ? 5 : n % 3 === 0 ? 1 : 0 }; }
function prodPet(id, lvl) { return RARIDADES[PET_POR_ID[id].r].prod * (1 + 0.3 * (lvl - 1)); }
function ativos(S) {
  return Object.keys(S.pets)
    .map(id => ({ id, lvl: S.pets[id].lvl, prod: prodPet(id, S.pets[id].lvl) }))
    .sort((a, b) => b.prod - a.prod)
    .slice(0, S.slots);
}
function setsCompletos(S) { return RARIDADES.map((_, r) => PETS.filter(p => p.r === r).every(p => S.pets[p.id])); }
function bonusSets(S) { const c = setsCompletos(S); return c.reduce((a, ok, r) => a + (ok ? SET_BONUS[r] : 0), 0); }
function bonusGuildaProd(S) { return S.guilda.id >= 0 ? 0.04 * (S.guilda.nivel - 1) : 0; }
function prodBase(S) { return ativos(S).reduce((a, p) => a + p.prod, 0); }
function multProd(S) { return multMoinho(S.obras.moinho) * (1 + bonusSets(S)) * (1 + bonusGuildaProd(S)); }
function prodTotal(S) { return prodBase(S) * multProd(S); }
function capCeleiro(S) { return Math.max(200, prodTotal(S) * 3600 * horasCeleiro(S.obras.celeiro)); }
function pastoProx(S) { return S.slots < SLOTS_MAX ? { custo: PASTO_CUSTO[S.slots - SLOTS_INI], nivel: PASTO_NIVEL[S.slots - SLOTS_INI] } : null; }
function desbloqueios(n) {
  const r = [];
  for (const id in OBRAS) if (OBRAS[id].nivel === n && n > 1) r.push(OBRAS[id].nome);
  PASTO_NIVEL.forEach((l, i) => { if (l === n) r.push('Pasto ' + (i + 4)); });
  if (n === OVOS.dourado.nivel) r.push('Ovo Dourado');
  if (n === NIVEL_GUILDA) r.push('Guilda');
  if (n === 6 || n === 12) r.push('Nova incubadora');
  return r;
}
function ajustarIncubadoras(S) { const n = incubadoras(S.nivel); while (S.eggs.length < n) S.eggs.push(null); }

/* ----- pseudo-aleatório determinístico (jogadores simulados) ----- */
function h32(x) { x = (x ^ 61) ^ (x >>> 16); x = x + (x << 3); x = x ^ (x >>> 4); x = Math.imul(x, 0x27d4eb2d); x = x ^ (x >>> 15); return x >>> 0; }
const rnd01 = (a, b) => (h32(Math.imul(a, 7919) + Math.imul(b, 104729) + 12345) % 100000) / 100000;

/* ----- guilda (jogadores simulados) ----- */
const GUILDAS = [
  { id: 0, nome: 'Liga do Celeiro',  lema: 'Um ovo novo por dia' },
  { id: 1, nome: 'Raposas da Roça',  lema: 'Espertas e sempre no pasto' },
  { id: 2, nome: 'Os Colhedores',    lema: 'Quem planta, colhe' }
];
const NOMES = ['Mari', 'Zé do Milho', 'Tati', 'Duda', 'Bento', 'Lia', 'Caco', 'Nina', 'Teco', 'Gabi', 'Rafa', 'Joaquim', 'Bia', 'Pipo', 'Dona Cida', 'Tonho', 'Léo', 'Sol', 'Vitória', 'Nando'];
const SUFIXOS = ['do Vale', 'da Serra', 'do Riacho'];
const N_MEMBROS = 14;
const BAUS = [{ p: 0.25, k: 2, g: 2 }, { p: 0.5, k: 4, g: 3 }, { p: 0.75, k: 8, g: 5 }, { p: 1, k: 15, g: 10 }];
const MIN_PONTOS_BAU = 30;
const membroNome = (gid, i) => NOMES[(i + gid * 4) % NOMES.length];
const membroPapel = i => i === 0 ? 'Líder' : i === 1 ? 'Vice' : 'Membro';
const membroTaxa = (gid, i) => 0.8 + rnd01(gid * 100 + i, 1) * 3.4;
const pontosMembro = (gid, i, now) => Math.floor(membroTaxa(gid, i) * horasSemana(now));
const membroNivel = (S, i, now) => 4 + Math.floor(rnd01(S.guilda.id * 100 + i, 2) * 22) + Math.floor(Math.max(0, diaDe(now) - S.criadoDia) * 0.2);
function fundoGuilda(S, now) {
  const g = S.guilda; let soma = 0;
  for (let i = 0; i < N_MEMBROS; i++) soma += membroTaxa(g.id, i);
  return soma * 0.4 * Math.max(0, (now - g.entrou) / HORA) + g.doado;
}
const fundoNivel = n => Math.round(2500 * Math.pow(1.7, n - 1));  // fundo necessário para passar do nível n para n+1
function nivelPorFundo(f) { let n = 1; while (n < 20 && f >= fundoNivel(n)) n++; return n; }
function atualizarGuilda(S, now) {
  const g = S.guilda; if (g.id < 0 || g.id >= GUILDAS.length) return;   // guilda online: o servidor manda
  g.nivel = nivelPorFundo(fundoGuilda(S, now));
  const sem = semanaDe(now);
  if (g.semana !== sem) { g.semana = sem; g.pontos = 0; g.baus = [0, 0, 0, 0]; }
}
const metaSemana = S => Math.round(9000 * (1 + 0.1 * (S.guilda.nivel - 1)));
function totalSemana(S, now) {
  let t = S.guilda.pontos;
  for (let i = 0; i < N_MEMBROS; i++) t += pontosMembro(S.guilda.id, i, now);
  return t;
}
/* Ganchos do modo online (src/online.js): recebem os pontos e os choques raros para enviar ao servidor. */
let HOOK_PONTOS = null, HOOK_CHOQUE = null;
function addPontos(S, n, motivo) {
  if (S.guilda.id >= 0) S.guilda.pontos += n;
  if (motivo && HOOK_PONTOS) HOOK_PONTOS(n, motivo);
}
function membrosOrdenados(S, now) {
  const l = [];
  for (let i = 0; i < N_MEMBROS; i++) l.push({ i, nome: membroNome(S.guilda.id, i), papel: membroPapel(i), nivel: membroNivel(S, i, now), pontos: pontosMembro(S.guilda.id, i, now), voce: false });
  l.push({ i: -1, nome: 'Você', papel: 'Membro', nivel: S.nivel, pontos: S.guilda.pontos, voce: true });
  return l.sort((a, b) => b.pontos - a.pontos);
}
function entrarGuilda(S, id, now) {
  if (S.nivel < NIVEL_GUILDA) return { erro: 'nivel' };
  if (S.guilda.id >= 0) return { erro: 'ja' };
  S.guilda = { id, entrou: now, doado: 0, nivel: 1, pontos: 0, semana: -1, baus: [0, 0, 0, 0], ajudou: {}, parab: {}, parabDia: { dia: -1, qtd: 0 } };
  atualizarGuilda(S, now);
  return { ok: true, ups: ganharXP(S, 40) };
}
function doar(S, valor, now) {
  if (S.guilda.id < 0) return { erro: 'sem' };
  if (S.coins < valor) return { erro: 'moedas' };
  S.coins -= valor; S.guilda.doado += valor;
  addPontos(S, Math.floor(valor / 50));
  atualizarGuilda(S, now);
  return { ok: true, ups: ganharXP(S, Math.ceil(Math.sqrt(valor) / 2)) };
}
function ajudar(S, i, now) {
  const g = S.guilda, dia = diaDe(now);
  if (g.id < 0) return { erro: 'sem' };
  if (g.ajudou[i] === dia) return { erro: 'ja' };
  g.ajudou[i] = dia;
  const coins = Math.max(30, Math.round(prodTotal(S) * 60));
  S.coins += coins; addPontos(S, 15);
  return { ok: true, coins, ups: ganharXP(S, 5) };
}
function resgatarBau(S, i, now) {
  const g = S.guilda;
  if (g.id < 0) return { erro: 'sem' };
  if (g.baus[i]) return { erro: 'ja' };
  if (g.pontos < MIN_PONTOS_BAU) return { erro: 'min' };
  if (totalSemana(S, now) < BAUS[i].p * metaSemana(S)) return { erro: 'meta' };
  const base = Math.max(200, Math.round(prodTotal(S) * 600)), b = BAUS[i];
  S.coins += b.k * base; S.gems += b.g; g.baus[i] = 1;
  return { ok: true, coins: b.k * base, gems: b.g, ups: ganharXP(S, 30 + 10 * i) };
}
/* mural: um evento novo a cada 25 minutos, sempre igual para o mesmo horário */
const SLOT_MURAL = 25 * 60000;
function muralEventos(S, now, n) {
  const g = S.guilda, atual = Math.floor(now / SLOT_MURAL), out = [];
  if (g.id < 0) return out;
  for (let j = 0; j < n; j++) {
    const slot = atual - j, hh = h32(g.id * 997 + slot);
    const i = hh % N_MEMBROS, nome = membroNome(g.id, i), tipo = (hh >>> 4) % 5;
    let txt;
    if (tipo === 0) { const r = 2 + ((hh >>> 8) % 20 < 15 ? 0 : (hh >>> 8) % 20 < 19 ? 1 : 2); const l = PETS.filter(p => p.r === r); const p = l[(hh >>> 12) % l.length]; txt = `${nome} chocou ${p.em} ${p.nome} (${RARIDADES[r].nome})!`; }
    else if (tipo === 1) txt = `${nome} subiu para o nível ${membroNivel(S, i, slot * SLOT_MURAL)}.`;
    else if (tipo === 2) txt = `${nome} doou ${(1 + (hh >>> 9) % 9) * 500} moedas ao fundo da guilda.`;
    else if (tipo === 3) txt = `${nome} completou a safra ${5 + (hh >>> 10) % 40}.`;
    else txt = `${nome} ajudou ${membroNome(g.id, (i + 3) % N_MEMBROS)} no sítio.`;
    out.push({ key: slot, txt, t: slot * SLOT_MURAL });
  }
  return out;
}
function parabenizar(S, key, now) {
  const g = S.guilda, dia = diaDe(now);

  return `<section class="card"><h2>Painel de anúncios</h2>
      <p class="muted">Valores simulados para estimar o potencial do jogo. O eCPM real varia por país, rede de anúncios e público.</p>
      <div class="scroll-x"><table><thead><tr><th>Anúncio recompensado</th><th>Assistidos</th></tr></thead><tbody>
        ${linha('Coletar em dobro', a.dobro)}${linha('Chocar agora', a.acelerar)}${linha('Ovo grátis', a.ovo)}${linha('+2 gemas', a.gemas)}${linha('Missão em dobro', a.missao)}${linha('Bônus diário em dobro', a.diario)}
        <tr><td><b>Total</b></td><td><b>${tot}</b></td></tr></tbody></table></div></section>
    <section class="card"><h2>Calculadora de receita</h2>
      <div class="field-in"><label for="devEcpm">eCPM (US$ por mil anúncios)</label><input id="devEcpm" data-dev="ecpm" type="number" inputmode="decimal" min="0" step="0.5" value="${S.dev.ecpm}"></div>
      <div class="field-in"><label for="devDau">Jogadores ativos por dia</label><input id="devDau" data-dev="dau" type="number" inputmode="numeric" min="0" step="100" value="${S.dev.dau}"></div>
      <div class="field-in"><label for="devAds">Anúncios assistidos por jogador por dia</label><input id="devAds" data-dev="adsDia" type="number" inputmode="decimal" min="0" step="1" value="${S.dev.adsDia}"></div>
      <div class="kpi"><span class="muted">Seus anúncios nesta partida</span><span class="big" id="devSessao">—</span></div>
      <div class="kpi"><span class="muted">Projeção por dia</span><span class="big" id="devDia">—</span></div>
      <div class="kpi"><span class="muted">Projeção por mês</span><span class="big" id="devMes">—</span></div></section>
    <section class="card"><h2>Sobre o modo social</h2><p class="muted">${window.ON && ON.ativo ? 'Conectado ao servidor: guilda, ranking e mural usam jogadores reais, e seu progresso é salvo na nuvem.' : 'Guilda, ranking e mural usam jogadores simulados que seguem o relógio real. Na versão online, esses dados vêm de um servidor com contas e salvamento na nuvem.'}</p></section>
    <section class="card"><h2>Dados do jogo</h2><p class="muted">O progresso fica salvo neste navegador.</p>
      <button class="btn ghost" data-act="resetar">${confirmaReset ? 'Toque de novo para confirmar' : 'Zerar progresso'}</button></section>`;
}
function calcDev() {
  const a = S.ads, tot = Object.keys(a).reduce((x, k) => x + a[k], 0), e = S.dev.ecpm / 1000, dia = S.dev.dau * S.dev.adsDia * e;
  const set = (id, v) => { const el = $(id); if (el) el.textContent = v; };
  set('#devSessao', usd(tot * e)); set('#devDia', usd(dia)); set('#devMes', usd(dia * 30));
}

/* ---------- ciclo ---------- */
let abaVista = '', entrouT = 0;
function render() {
  const v = $('#view');
  if (aba !== abaVista) { abaVista = aba; v.classList.add('in'); clearTimeout(entrouT); entrouT = setTimeout(() => v.classList.remove('in'), 650); }
  v.innerHTML = aba === 'sitio' ? viewSitio() : aba === 'ovos' ? viewOvos() : aba === 'obras' ? viewObras() : aba === 'guilda' ? viewGuilda() : aba === 'metas' ? viewMetas() : viewDev();
  document.querySelectorAll('#nav button').forEach(b => {
    const on = b.dataset.arg === aba; b.classList.toggle('on', on);
    if (on) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
  });
  if (aba === 'sitio') Cena.montar($('#cenaHost')); else Cena.parar();
  if (aba === 'dev') calcDev();
  tick();
}
function temMelhoria() {
  const p = pastoProx(S);
  if (p && S.nivel >= p.nivel && S.coins >= p.custo) return true;
  return Object.keys(OBRAS).some(id => { const o = OBRAS[id], l = S.obras[id]; return S.nivel >= o.nivel && l < o.max && S.nivel >= nivelParaObra(l) && S.coins >= custoObra(id, l); });
}
let guiaTxt = '';
function tick() {
  const now = Date.now();
  processar(avancar(S, now));
  const navBtn = k => document.querySelector('#nav button[data-arg="' + k + '"]');
  const pend = S.missoes.some(m => m && m.feita) || S.diario.ultimo !== diaDe(now);
  navBtn('metas').classList.toggle('has', pend);
  navBtn('obras').classList.toggle('has', temMelhoria());
  navBtn('guilda').classList.toggle('has', bauPronto(now));
  navBtn('ovos').classList.toggle('has', S.eggs.some(e => e && now >= e.pronto));
  const cap = capCeleiro(S), q = Math.floor(S.barn), p = prodTotal(S), max = S.nivel >= NIVEL_MAX, prox = xpProx(S.nivel);
  $('#hudLv').textContent = S.nivel; $('#hudTit').textContent = tituloDe(S.nivel);
  const xpPct = max ? 100 : Math.min(100, S.xp / prox * 100);
  $('#hudRing').style.setProperty('--p', xpPct.toFixed(1)); $('#hudXp').style.width = xpPct + '%';
  const fab = $('#fab'), mostrarFab = aba !== 'sitio' && aba !== 'dev' && q >= Math.max(20, cap * 0.25);
  if (fab.hidden === mostrarFab) fab.hidden = !mostrarFab;
  if (mostrarFab) $('#fabQtd').textContent = '+' + fmt(q);
  if (aba === 'sitio') {
    const at = ativos(S);
    Cena.atualizar({ nivel: S.nivel, tier: tierDe(S.nivel), obras: S.obras, pct: S.barn / cap, ativos: at.map(a => ({ id: a.id, em: PET_POR_ID[a.id].em, r: PET_POR_ID[a.id].r })) });
    $('#prodTxt').textContent = '+' + fmt1(p) + ' moedas/s';
    $('#lvTit').textContent = tituloDe(S.nivel);
    $('#btnColetar').disabled = q < 1; $('#btnDobro').disabled = q < 1;
    $('#barnTxt').textContent = fmt(q) + ' / ' + fmt(cap);
    const meta = metaSafra(S.safra);
    $('#safNum').textContent = S.safra; $('#safBar').style.width = Math.min(100, S.safraProg / meta * 100) + '%';
    $('#safEta').textContent = p > 0 ? 'faltam ' + duracao((meta - S.safraProg) / p) : 'sem produção';
    $('#safRec').textContent = textoRec(Object.assign({}, recSafra(S.safra)));
    const g = guiaHTML(); if (g !== guiaTxt) { guiaTxt = g; $('#guia').innerHTML = g; }
  }
  if (aba === 'ovos') {
    let refazer = false;
    document.querySelectorAll('[data-timer]').forEach(el => {
      const e = S.eggs[+el.dataset.timer]; if (!e) return;
      const pronto = now >= e.pronto;
      if ((el.dataset.ready === '1') !== pronto) refazer = true; else if (!pronto) el.textContent = mmss(e.pronto - now);
    });
    document.querySelectorAll('[data-cd]').forEach(b => {
      const rest = Math.ceil(((S.cd[b.dataset.cd] || 0) - now) / 1000), l = b.querySelector('.cdl');
      if (rest > 0) { b.disabled = true; l.textContent = 'em ' + rest + 's'; } else { b.disabled = false; l.textContent = b.dataset.label; }
    });
    if (refazer) { render(); return; }
  }
  if (now - ultimoSalvo > 5000) salvar();
}
/* saldo com contagem suave e "pulinho" quando muda */
let dispC = null, dispG = null, ultC = 0, ultG = 0;
function hudLoop() {
  if (dispC === null) { dispC = ultC = S.coins; dispG = ultG = S.gems; }
  const passo = (d, alvo) => Math.abs(alvo - d) < 1 ? alvo : d + (alvo - d) * 0.2;
  dispC = passo(dispC, S.coins); dispG = passo(dispG, S.gems);
  const eC = $('#vCoins'), eG = $('#vGems'), tC = fmt(Math.round(dispC)), tG = fmt(Math.round(dispG));
  if (eC.textContent !== tC) eC.textContent = tC; if (eG.textContent !== tG) eG.textContent = tG;
  if (S.coins > ultC) bump('#chipCoins'); if (S.gems > ultG) bump('#chipGems');
  ultC = S.coins; ultG = S.gems;
  requestAnimationFrame(hudLoop);
}
function bump(id) { const e = $(id); e.classList.add('bump'); setTimeout(() => e.classList.remove('bump'), 160); }
const alvoMoedas = () => { const r = $('#chipCoins').getBoundingClientRect(); return { x: r.left + 20, y: r.top + r.height / 2 }; };
function atualizarSom() { const b = $('#btnSom'); b.classList.toggle('off', Som.mudo); b.setAttribute('aria-pressed', String(!Som.mudo)); }
function boasVindas() {
  S.visto = true; salvar();
  abrirModal(`<div class="sheet pop"><p class="eyebrow">Bem-vindo</p><h2>Sítio dos Bichos</h2>
    <div class="passos"><div><span>🥚</span><p><b>Choque ovos</b> e descubra bichos de várias raridades.</p></div>
    <div><span>🌾</span><p><b>Os bichos produzem moedas.</b> Toque no celeiro para coletar.</p></div>
    <div><span>🔨</span><p><b>Melhore o sítio</b> e entre numa guilda para ganhar prêmios.</p></div></div>
    <p class="muted">Dica: o botão amarelo "Próximo passo" sempre mostra o que fazer.</p>
    <button class="btn primary xl" data-act="fechar">Vamos lá!</button></div>`);
}
/* ao abrir: resumo do que aconteceu enquanto o jogo estava fechado */
(function iniciar() {
  const ocioso = (Date.now() - S.ts) / 1000, antes = S.barn, coinsAntes = S.coins;
  const r = avancar(S, Date.now());
  processar(r, true);
  render();
  if (ocioso > 180) {
    const ganhoCeleiro = Math.floor(S.barn - antes), safras = r.safras.length;
    if (ganhoCeleiro >= 1 || safras) {
      const cheio = S.barn >= capCeleiro(S) - 1;
      abrirModal(`<div class="sheet pop"><p class="eyebrow">Bem-vindo de volta</p><h2>Seu sítio trabalhou ${duracao(ocioso)}</h2>
        <p class="muted">${ganhoCeleiro >= 1 ? '+' + fmt(ganhoCeleiro) + ' moedas esperando no celeiro' : ''}${safras ? '<br>' + safras + (safras > 1 ? ' safras concluídas' : ' safra concluída') + ' (+' + fmt(S.coins - coinsAntes) + ' moedas)' : ''}${cheio ? '<br>O celeiro encheu. Melhore o Celeiro para guardar mais.' : ''}</p>
        <button class="btn primary" data-act="fechar">Continuar</button></div>`);
    }
  }
  drenar();
  if (!S.visto && !(window.SITIO_CONFIG && !S.nome)) boasVindas();
})();
atualizarSom(); hudLoop();
Cena.aoTocar({
  celeiro: () => ACOES.coletar(),
  bicho: (b, p) => { Fx.glifo(p.x, p.y, '❤️', 22); Fx.brilhos(p.x, p.y + 12, 6, '#FFD23F'); Som.play('pop'); Som.vibrar(8); },
  fazendeiro: () => { const p = Cena.posCeleiro() || { x: innerWidth / 2, y: 200 }; Fx.glifo(p.x + 30, p.y + 40, '👋', 26); Som.play('tap'); }
});

setInterval(tick, 250);
document.addEventListener('visibilitychange', () => { if (document.hidden) salvar(); else tick(); });
</script>
