<div class="shell">
  <header class="top">
    <button class="lvring" id="hudRing" data-act="perfil" aria-label="Meu perfil"><b id="hudLv">1</b></button>
    <div class="hudwho" data-act="perfil"><b id="hudTit">Fazendeiro</b><div class="xpmini"><i id="hudXp"></i></div></div>
    <div class="wallet" aria-label="Saldo">
      <span class="chip" id="chipCoins" title="Moedas"><svg viewBox="0 0 24 24" aria-hidden="true"><defs><linearGradient id="gcoin" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFE27A"/><stop offset="1" stop-color="#F5A300"/></linearGradient><radialGradient id="${gid}r" cx=".35" cy=".3" r=".85"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset=".35" stop-color="${f1}"/><stop offset="1" stop-color="${f2}"/></radialGradient><radialGradient id="${gid}s" cx=".38" cy=".3" r=".85"><stop offset=".6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#2a1500" stop-opacity=".38"/></radialGradient></defs><circle cx="12" cy="12" r="10.5" fill="url(#gcoin)" stroke="#D98F00" stroke-width="1.5"/><circle cx="12" cy="12" r="6.6" fill="none" stroke="#D98F00" stroke-width="1.4" opacity=".55"/><path d="M8 8c1.5-1.2 3-1.6 4.4-1.4" stroke="#fff" stroke-width="1.6" stroke-linecap="round" fill="none" opacity=".7"/></svg><span id="vCoins">0</span></span>
      <span class="chip" id="chipGems" title="Gemas"><svg viewBox="0 0 24 24" aria-hidden="true"><defs><linearGradient id="ggem" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8FD6FF"/><stop offset="1" stop-color="#1B72D8"/></linearGradient></defs><polygon points="12,1.5 21,9 12,22.5 3,9" fill="url(#ggem)" stroke="#1B5FB5" stroke-width="1.3" stroke-linejoin="round"/><polyline points="3,9 21,9" stroke="#fff" stroke-width="1.2" opacity=".6" fill="none"/><polyline points="8,9 12,1.5 16,9" stroke="#fff" stroke-width="1" opacity=".4" fill="none"/></svg><span id="vGems">0</span></span>
 <span class="chip" id="chipIng" title="Ingressos de sorteio" hidden><span aria-hidden="true">🎟️</span><span id="vIng">0</span></span>
      <button class="iconbtn" id="btnAj" data-act="aba" data-arg="ajustes" aria-label="Ajustes"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M18.7 5.3l-2.1 2.1M7.4 16.6l-2.1 2.1"/></svg></button>
      <button class="iconbtn" id="btnSom" data-act="som" aria-label="Som ligado ou desligado"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z"/><path class="onda" d="M16.5 9a4 4 0 010 6M19 6.5a8 8 0 010 11"/><path class="slash" d="M17 9l5 6M22 9l-5 6"/></svg></button>
    </div>
  </header>
  <main id="view"></main>
  <div class="fab" id="fab" hidden><button class="btn primary" data-act="coletar">Coletar <b class="num" id="fabQtd"></b></button></div>
  <nav id="nav" aria-label="Seções">
    <button data-act="aba" data-arg="sitio"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-7 9 7v9H3z"/><path d="M9 20v-6h6v6"/></svg>Sítio</button>
    <button data-act="aba" data-arg="ovos"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3C8 3 5 10 5 14.5 5 18.5 8 21 12 21s7-2.5 7-6.5C19 10 16 3 12 3z"/></svg>Ovos</button>
    <button data-act="aba" data-arg="obras"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l9-9"/><path d="M12 4l5 1 2 5-3 3-4-4z"/></svg>Obras</button>
    <button data-act="aba" data-arg="guilda"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M3 19c0-3 3-5 6-5s6 2 6 5M15 15c3 0 6 1.500 6 4"/></svg>Guilda</button>
    <button data-act="aba" data-arg="metas"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 6l2 2 3-3M5 14l2 2 3-3M13 7h6M13 15h6"/></svg>Metas</button>
  </nav>
</div>
<div id="modal" class="modal" hidden></div>
<div id="toast" class="toast" hidden role="status"></div>
<canvas id="fx" aria-hidden="true"></canvas>

<script id="logic">
/*LOGIC*/
</script>

<script>
/* ===== Interface ===== */
/*FX*/
TZ_OFF = new Date().getTimezoneOffset();
const KEY = 'sitio-dos-bichos.v1';
const $ = s => document.querySelector(s);
const esc = t => String(t == null ? '' : t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function carregar() {
  let s = null;
  try { s = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
  const base = novoEstado(Date.now());
  if (!s || typeof s !== 'object') return base;
  const r = Object.assign(base, s);
  ['obras', 'cd', 'ads', 'dev', 'stats', 'diario', 'guilda', 'premium', 'cfg', 'tut', 'bau', 'brilho', 'metr'].forEach(k => { r[k] = Object.assign({}, base[k], s[k]); });
  // bichos que não existem mais viram animais reais (mantém o maior nível)
  for (const velho in PET_MIGRA) if (r.pets[velho]) { const novo = PET_MIGRA[velho]; r.pets[novo] = r.pets[novo] ? (r.pets[novo].lvl >= r.pets[velho].lvl ? r.pets[novo] : r.pets[velho]) : r.pets[velho]; delete r.pets[velho]; }
  for (const id of Object.keys(r.pets)) if (!PET_POR_ID[id] || !r.pets[id] || !(r.pets[id].lvl >= 1)) delete r.pets[id];
  if (!Array.isArray(r.horta)) r.horta = []; r.horta = r.horta.map(p => p && CULTIVOS[p.id] ? p : null);
  if (!r.colheita || typeof r.colheita !== 'object') r.colheita = {};
  if (!Array.isArray(r.pedidos) || r.pedidos.length !== 3) r.pedidos = [null, null, null];
  if (!r.decor || typeof r.decor !== 'object') r.decor = {};
  for (const k of Object.keys(r.decor)) if (!DECORS[k]) delete r.decor[k];
  if (!r.evt || !Array.isArray(r.evt.res)) r.evt = base.evt;
  r.eggs = r.eggs.map(e => e && OVOS[e.tipo] ? e : null);
  if (!r.prest) r.prest = 0;
  if (!TEMAS[r.tema]) r.tema = 'auto';
  if (!Array.isArray(r.eggs)) r.eggs = [null, null];
  if (!r.pets || typeof r.pets !== 'object') r.pets = {};
  if (!Array.isArray(r.missoes) || r.missoes.length !== 3) { r.missoes = [null, null, null]; for (let i = 0; i < 3; i++) r.missoes[i] = novaMissao(r); }
  r.missoes = r.missoes.map(m => m || novaMissao(r));
  if (r.guilda.id >= GUILDAS.length) r.guilda = base.guilda;   // sobra do modo online
  ajustarIncubadoras(r); ajustarTudo(r, Date.now());
  return r;
}
let S = carregar();
try { const cv = new URLSearchParams(location.search).get('convite'); if (cv && /^[0-9A-Za-z]{4,12}$/.test(cv) && !S.convitePend && !S.convUsado) { S.convitePend = cv.toUpperCase(); } } catch (e) {}
let aba = 'sitio', subG = 'guilda', subM = 'missoes';
Som.semVibra = false;
let ultimoSalvo = 0, confirmaReset = false;
function salvar() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} ultimoSalvo = Date.now(); }

const fmt = n => n >= 1e6 ? (n / 1e6).toFixed(2).replace('.', ',') + ' mi' : Math.floor(n).toLocaleString('pt-BR');
const fmt1 = n => n.toLocaleString('pt-BR', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
const pct = n => n.toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + '%';
const usd = n => 'US$ ' + n.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const mmss = ms => { const s = Math.max(0, Math.ceil(ms / 1000)); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); };
const duracao = s => { s = Math.max(0, Math.round(s)); if (s < 60) return s + ' s'; if (s < 3600) return Math.round(s / 60) + ' min'; if (s < 86400) return Math.floor(s / 3600) + ' h ' + Math.round((s % 3600) / 60) + ' min'; return Math.floor(s / 86400) + ' d ' + Math.round((s % 86400) / 3600) + ' h'; };
const reduzMov = () => window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const textoRec = r => [r.coins > 0 ? '+' + fmt(r.coins) + ' moedas' : '', r.gems > 0 ? '+' + r.gems + ' gemas' : '', r.xp > 0 ? '+' + r.xp + ' XP' : ''].filter(Boolean).join(' · ');

let toastT = null;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 2400); }
const ERROS = { ingrediente: 'Faltam ingredientes da horta', premium: 'Exige o Passe da Temporada', falta: 'Ainda não chegou lá', bichos: 'Escolha de 1 a 3 bichos livres', bloqueado: 'Destino ainda bloqueado', vaga: 'Sem vaga livre', ocupada: 'Já está em uso', sem_bichos: 'Você precisa de bichos', sem_festival: 'Nenhum festival ativo agora', nada: 'Nada para pegar agora', moedas: 'Moedas insuficientes', gemas: 'Gemas insuficientes', cheio: 'Incubadoras cheias. Abra um ovo primeiro.', max: 'Já está no máximo', min: 'Faça ' + MIN_PONTOS_BAU + ' pontos na semana para resgatar baús', meta: 'A guilda ainda não chegou nessa meta', ja: 'Você já fez isso hoje', limite: 'Limite diário de parabéns atingido', sem: 'Entre numa guilda primeiro' };
const erroMsg = e => (Som.play('erro'), erroMsg0(e));
const erroMsg0 = e => e.erro === 'nivel' ? 'Libera no nível ' + e.nivel : e.erro === 'cap' ? 'Precisa de fazendeiro nível ' + e.nivel : (ERROS[e.erro] || 'Não foi possível');

const PLAY = '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M3 1.5v9l7-4.5z" fill="currentColor"/></svg>';
function eggSVG(tipo) {
  const ouro = tipo === 'dourado', brilho = tipo === 'brilhante';
  const f1 = brilho ? '#A5EBFF' : ouro ? '#FBD35A' : '#D9C48A', f2 = brilho ? '#3A8FE0' : ouro ? '#E39A0B' : '#B79B5B', pinta = brilho ? '#E6FAFF' : ouro ? '#FFF1B8' : '#8F7640', gid = 'g' + tipo;
  return `<svg class="eggsvg" viewBox="0 0 64 76" aria-hidden="true"><defs><linearGradient id="${gid}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${f1}"/><stop offset="1" stop-color="${f2}"/></linearGradient><radialGradient id="${gid}r" cx=".35" cy=".3" r=".85"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset=".35" stop-color="${f1}"/><stop offset="1" stop-color="${f2}"/></radialGradient><radialGradient id="${gid}s" cx=".38" cy=".3" r=".85"><stop offset=".6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#2a1500" stop-opacity=".38"/></radialGradient></defs><path d="M32 3C19 3 7 26 7 47c0 17 11 26 25 26s25-9 25-26C57 26 45 3 32 3z" fill="url(#${gid}r)"/><path d="M32 3C19 3 7 26 7 47c0 17 11 26 25 26s25-9 25-26C57 26 45 3 32 3z" fill="url(#${gid}s)"/><circle cx="40" cy="48" r="3" fill="${pinta}" opacity=".55"/><circle cx="28" cy="58" r="2.2" fill="${pinta}" opacity=".55"/><circle cx="44" cy="36" r="1.8" fill="${pinta}" opacity=".55"/><ellipse cx="21" cy="25" rx="4.5" ry="9" fill="#fff" opacity=".6" transform="rotate(20 21 25)"/><ellipse cx="17" cy="40" rx="1.6" ry="3" fill="#fff" opacity=".4" transform="rotate(12 17 40)"/></svg>`;
}

/* ---------- modais ---------- */
const MODAL = $('#modal');
let fila = [], adT = null, adReward = null, adTipo = null;
function abrirModal(h) { MODAL.hidden = false; MODAL.innerHTML = h; }
function fecharModal() { clearInterval(adT); adReward = null; MODAL.hidden = true; MODAL.innerHTML = ''; drenar(); }
function receber(ups) { if (ups && ups.length) fila.push(...ups); }
function drenar() {
  if (!MODAL.hidden || !fila.length) return;
  const u = fila.shift(), d = desbloqueios(u.nivel);
  abrirModal(`<div class="sheet pop"><p class="eyebrow">Você subiu de nível</p><div class="lvbig">${u.nivel}</div><h2>${tituloDe(u.nivel)}</h2>
    <p class="muted">+${u.gems} gemas${d.length ? '<br>Liberou: <b>' + d.join(', ') + '</b>' : ''}</p>
    <button class="btn primary xl" data-act="fechar">Continuar</button></div>`);
  Som.play('nivel'); Som.vibrar([30, 40, 60]); Fx.confete(innerWidth / 2, innerHeight * 0.4, 110, ['#FFC21A', '#3DBB6B', '#2F9BE8', '#FF7AB6', '#fff']);
}
function anuncio(tipo, titulo, recompensa) {
  if (semAnuncios(S)) { evento(S, 'anuncio', 1); recompensa(); salvar(); render(); return; }
  metrica('anuncio');
  adReward = recompensa; adTipo = tipo;
  abrirModal(`<div class="sheet"><p class="eyebrow">Anúncio simulado</p><h2>${titulo}</h2>
    <div><div class="bar"><i id="adBar"></i></div><p class="muted" id="adMsg" style="margin-top:8px">Assistindo… 3s</p></div>
    <p class="muted">No app publicado, aqui entra um anúncio recompensado de verdade (AdMob).</p>
    <div class="row"><button class="btn ghost" data-act="fechar">Cancelar</button><button class="btn primary" id="adOk" data-act="adok" disabled>Receber</button></div></div>`);
  const dur = 3000, ini = Date.now();
  clearInterval(adT);
  adT = setInterval(() => {
    const p = Math.min(1, (Date.now() - ini) / dur), bar = $('#adBar');
    if (!bar) { clearInterval(adT); return; }
    bar.style.width = (p * 100) + '%';
    if (p >= 1) { clearInterval(adT); $('#adMsg').textContent = 'Pronto! Receba sua recompensa.'; $('#adOk').disabled = false; }
    else $('#adMsg').textContent = 'Assistindo… ' + Math.ceil((dur - (Date.now() - ini)) / 1000) + 's';
  }, 100);
}
function abrirOvoUI(i) {
  const r = abrirOvo(S, i, Date.now());
  if (!r) return;
  receber(r.ups); salvar();
  Som.play('ovo'); Som.vibrar([20, 40, 20, 40, 20]);
  abrirModal(`<div class="sheet"><div class="hatchegg ${reduzMov() ? '' : 'shake'}">${eggSVG(r.tipo)}</div><p class="muted">Chocando…</p></div>`);
  setTimeout(() => {
    if (MODAL.hidden) return;
    const msg = r.res.tipo === 'novo' ? 'Novo bicho na coleção!' : r.res.tipo === 'nivel' ? 'Repetido: subiu para o nível ' + r.res.lvl : 'Nível máximo: +' + fmt(r.res.reembolso) + ' moedas';
    abrirModal(`<div class="sheet" style="--rc:var(--r${r.r})"><div class="reveal pop"><div class="rays"></div><div class="face">${r.pet.em}</div>${r.res.tipo === 'novo' ? '<span class="novo">NOVO!</span>' : ''}<p class="rlabel">${RARIDADES[r.r].nome}</p><h2>${r.pet.nome}</h2><p class="muted">${msg}</p><p class="muted">Produz ${fmt1(prodPet(r.pet.id, S.pets[r.pet.id].lvl))} moedas/s base</p></div><button class="btn primary xl" data-act="fechar">Continuar</button></div>`);
    const x = innerWidth / 2, y = innerHeight * 0.42, cor = COR_RAR[r.r];
    Som.play(['comum', 'comum', 'raro', 'epico', 'lendario'][r.r]); Som.vibrar(r.r >= 3 ? [40, 30, 80, 30, 120] : 30);
    Fx.brilhos(x, y, 10 + r.r * 6, cor);
    if (r.r >= 1) Fx.confete(x, y, [0, 24, 60, 120, 220][r.r], [cor, '#FFC21A', '#FFFFFF', '#FF7AB6', '#62B9F5']);
    if (r.r >= 3) setTimeout(() => Fx.confete(innerWidth * 0.2, innerHeight * 0.6, 60, [cor, '#FFC21A', '#fff']), 260), setTimeout(() => Fx.confete(innerWidth * 0.8, innerHeight * 0.6, 60, [cor, '#FFC21A', '#fff']), 420);
  }, reduzMov() ? 200 : 1400);
  render();
}

/* ---------- ações ---------- */
function processar(r, semDrenar) {
  if (r.ups.length) receber(r.ups);
  if (r.safras.length) {
    const c = r.safras.reduce((a, s) => a + s.rec.coins, 0);
    toast(r.safras.length === 1 ? `Safra ${r.safras[0].n} concluída! +${fmt(c)} moedas` : `${r.safras.length} safras concluídas! +${fmt(c)} moedas`);
  }
  if (!semDrenar) drenar();
}
const ACOES = {
  aba(a) { aba = a; confirmaReset = false; render(); $('#view').scrollTop = 0; },
  subG(x) { subG = x; render(); },
  subOAba() { aba = 'obras'; subO = 'horta'; render(); },
  subM(x) { subM = x; render(); },
  fechar() { fecharModal(); },
  adok() {
    const f = adReward, t = adTipo; if (!f) return;
    anuncioVisto(S, t); f(); fecharModal(); salvar(); render();
  },
  coletar() {
    const r = coletar(S, 1); if (!r) { Som.play('erro'); return toast('O celeiro está vazio. Aguarde a produção.'); }
    receber(r.ups); salvar(); render();
    const fb = $('#fab').hidden ? $('#btnColetar') : $('#fab .btn'), br = fb.getBoundingClientRect();
    const o = (aba === 'sitio' && Cena.posCeleiro()) || { x: br.left + br.width / 2, y: br.top };
    Fx.moedas(o.x, o.y, 4 + Math.round(Math.log10(r.ganho + 1) * 2.2), alvoMoedas());
    Fx.glifo(o.x, o.y - 18, '+' + fmt(r.ganho), 20); Som.play('coin'); Som.vibrar(15);
  },
  som() { Som.alternar(); atualizarSom(); },
  coletar2x() {
    if (Math.floor(S.barn) < 1) return;
    anuncio('dobro', 'Coletar em dobro', () => { const r = coletar(S, 2); if (r) { receber(r.ups); toast('+' + fmt(r.ganho) + ' moedas (dobro)'); } });
  },
  pasto() { const r = comprarPasto(S); if (!r.ok) return toast(erroMsg(r)); receber(r.ups); salvar(); render(); toast('Novo pasto liberado'); },
  melhorar(id) { const r = melhorarObra(S, id); if (!r.ok) return toast(erroMsg(r)); receber(r.ups); salvar(); render(); toast(OBRAS[id].nome + ' no nível ' + r.lvl); },
  comprar(tipo) { const r = comprarOvo(S, tipo, Date.now()); if (!r.ok) return toast(erroMsg(r)); salvar(); render(); },
  abrir(i) { abrirOvoUI(+i); },
  acelerar(i) { const e = S.eggs[+i]; if (!e || Date.now() >= e.pronto) return; anuncio('acelerar', 'Chocar agora', () => { if (S.eggs[+i]) S.eggs[+i].pronto = Date.now(); }); },
  ovoGratis() {
    if (S.cd.ovo > Date.now()) return;
    if (S.eggs.findIndex(e => !e) < 0) return toast(ERROS.cheio);
    anuncio('ovo', 'Ovo de Palha grátis', () => { const i = S.eggs.findIndex(e => !e); if (i >= 0) { S.eggs[i] = { tipo: 'palha', pronto: Date.now() }; S.cd.ovo = Date.now() + 90000; toast('Ovo pronto na incubadora'); } });
  },
  gemasGratis() { if (S.cd.gemas > Date.now()) return; anuncio('gemas', '+2 gemas', () => { S.gems += 2; S.cd.gemas = Date.now() + 60000; toast('+2 gemas'); }); },
  resgatar(i) { const r = resgatarMissao(S, +i, false); if (!r) return; receber(r.ups); salvar(); render(); toast('Missão concluída: ' + textoRec(r.rec)); },
  resgatar2x(i) {
    const m = S.missoes[+i]; if (!m || !m.feita) return;
    anuncio('missao', 'Recompensa em dobro', () => { const r = resgatarMissao(S, +i, true); if (r) { receber(r.ups); toast('Em dobro! ' + textoRec({ coins: r.rec.coins * 2, gems: r.rec.gems * 2, xp: 0 })); } });
  },
  diario() { const r = resgatarDiario(S, diaDe(Date.now()), false); if (!r) return; receber(r.ups); salvar(); render(); toast('Bônus do dia ' + r.seq + ': ' + textoRec({ coins: r.r.coins, gems: r.r.gems, xp: 0 })); },
  diario2x() {
    if (S.diario.ultimo === diaDe(Date.now())) return;
    anuncio('diario', 'Bônus diário em dobro', () => { const r = resgatarDiario(S, diaDe(Date.now()), true); if (r) { receber(r.ups); toast('Em dobro! ' + textoRec({ coins: r.r.coins * 2, gems: r.r.gems * 2, xp: 0 })); } });
  },
  entrar(id) { const r = entrarGuilda(S, +id, Date.now()); if (!r.ok) return toast(erroMsg(r)); receber(r.ups); salvar(); render(); toast('Bem-vindo à ' + GUILDAS[+id].nome); },
